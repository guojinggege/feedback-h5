<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="反馈" />
<meta name="theme-color" content="#f5efe1" />
<title>问题反馈</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f5efe1'/%3E%3Ctext x='50%25' y='54%25' font-family='Georgia,serif' font-size='38' text-anchor='middle' dominant-baseline='middle' fill='%23b8504a'%3EF%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23f5efe1'/%3E%3Ctext x='50%25' y='56%25' font-family='Georgia,serif' font-size='108' text-anchor='middle' dominant-baseline='middle' fill='%23b8504a'%3EF%3C/text%3E%3C/svg%3E" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
  :root {
    --bg: #f5efe1;
    --bg-soft: #efe7d4;
    --card: #fbf7ec;
    --card-elev: #ffffff;
    --ink: #2b2620;
    --ink-muted: #7a6f60;
    --line: #e6dcc4;
    --line-soft: #efe7d2;
    --dot-media: #c97a4a;
    --dot-problem: #b8504a;
    --dot-solution: #6b8e5a;
    --accent: #8a6d3b;
    --danger: #b8504a;
    --shadow: 0 1px 2px rgba(80, 60, 30, 0.04), 0 6px 18px rgba(80, 60, 30, 0.07);
    --shadow-lift: 0 2px 4px rgba(80, 60, 30, 0.06), 0 14px 32px rgba(80, 60, 30, 0.12);
    --radius: 18px;
    --radius-sm: 12px;
    --serif: 'Fraunces', 'Songti SC', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.55;
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: contain;
  }

  /* === Header === */
  .app-header {
    position: sticky;
    top: 0;
    z-index: 50;
    padding: calc(var(--safe-top) + 14px) calc(var(--safe-right) + 18px) 14px calc(var(--safe-left) + 18px);
    background: rgba(245, 239, 225, 0.88);
    backdrop-filter: saturate(150%) blur(14px);
    -webkit-backdrop-filter: saturate(150%) blur(14px);
    border-bottom: 1px solid var(--line-soft);
  }
  .app-header-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
  }
  .app-title {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 28px;
    letter-spacing: -0.01em;
    margin: 0;
    line-height: 1.1;
    font-variation-settings: "opsz" 96, "SOFT" 50;
  }
  .app-subtitle {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-muted);
    margin-top: 4px;
    letter-spacing: 0.02em;
  }
  .header-actions {
    display: flex;
    gap: 8px;
  }
  .icon-btn {
    appearance: none;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    padding: 9px 12px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .icon-btn:active { transform: scale(0.96); background: var(--bg-soft); }
  .icon-btn svg { width: 14px; height: 14px; }

  /* === Main === */
  main {
    padding: 20px calc(var(--safe-right) + 18px) calc(var(--safe-bottom) + 120px) calc(var(--safe-left) + 18px);
    max-width: 720px;
    margin: 0 auto;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-muted);
  }
  .empty-state .emoji {
    font-size: 40px;
    margin-bottom: 12px;
    font-family: var(--serif);
    color: var(--accent);
  }
  .empty-state h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 20px;
    color: var(--ink);
    margin: 0 0 6px;
  }
  .empty-state p {
    font-size: 12.5px;
    margin: 0;
    letter-spacing: 0.01em;
  }

  /* === Feedback Card === */
  .feedback-list { display: flex; flex-direction: column; gap: 18px; }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--line-soft);
    overflow: hidden;
  }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 6px;
  }
  .card-index {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 17px;
    color: var(--ink);
    font-style: italic;
    letter-spacing: 0.01em;
  }
  .card-index span {
    font-family: var(--mono);
    font-style: normal;
    font-size: 11px;
    color: var(--ink-muted);
    margin-left: 8px;
    letter-spacing: 0.04em;
  }
  .section { padding: 10px 16px 14px; }
  .section + .section { border-top: 1px dashed var(--line); }

  .section-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 8px;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.6);
  }
  .dot-media { background: var(--dot-media); }
  .dot-problem { background: var(--dot-problem); }
  .dot-solution { background: var(--dot-solution); }

  /* === Textarea === */
  textarea {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--card-elev);
    border-radius: var(--radius-sm);
    padding: 11px 13px;
    font-family: var(--mono);
    font-size: 16px;
    line-height: 1.7;
    color: var(--ink);
    resize: vertical;
    min-height: 80px;
    outline: none;
    transition: border 0.15s ease, box-shadow 0.15s ease;
    -webkit-appearance: none;
  }
  textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(138, 109, 59, 0.12);
  }
  textarea::placeholder {
    color: #b8ad99;
    font-family: var(--mono);
  }

  /* === Media grid === */
  .media-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
    gap: 8px;
  }
  .media-tile {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    overflow: hidden;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    cursor: pointer;
  }
  .media-tile img, .media-tile video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }
  .media-tile .video-badge {
    position: absolute;
    bottom: 4px;
    left: 4px;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    font-family: var(--mono);
    letter-spacing: 0.04em;
  }
  .media-remove {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    border: none;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .media-add {
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    border: 1.5px dashed var(--line);
    background: transparent;
    color: var(--ink-muted);
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 300;
    cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }
  .media-add:active {
    background: var(--bg-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .media-add input { display: none; }

  /* === Floating add button === */
  .fab-wrap {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 14px calc(var(--safe-right) + 18px) calc(var(--safe-bottom) + 14px) calc(var(--safe-left) + 18px);
    background: linear-gradient(to top, rgba(245, 239, 225, 0.98) 60%, rgba(245, 239, 225, 0));
    z-index: 40;
    display: flex;
    justify-content: center;
    pointer-events: none;
  }
  .fab {
    pointer-events: auto;
    appearance: none;
    border: none;
    background: var(--ink);
    color: var(--bg);
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 500;
    padding: 14px 24px;
    border-radius: 999px;
    box-shadow: var(--shadow-lift);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.01em;
    transition: transform 0.12s ease;
    font-style: italic;
  }
  .fab:active { transform: scale(0.97); }
  .fab .plus {
    font-family: var(--mono);
    font-style: normal;
    font-size: 18px;
    font-weight: 400;
    line-height: 1;
  }

  /* === Modal / preview === */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(20, 16, 10, 0.88);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: calc(var(--safe-top) + 20px) 20px calc(var(--safe-bottom) + 20px);
    animation: fadeIn 0.18s ease;
  }
  .modal.open { display: flex; }
  .modal-content {
    max-width: 100%;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .modal-content img, .modal-content video {
    max-width: 100%;
    max-height: calc(100vh - 140px);
    max-height: calc(100dvh - 140px);
    border-radius: 12px;
    object-fit: contain;
    background: #000;
  }
  .modal-close {
    appearance: none;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.18);
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 18px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 0.04em;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* === Toast === */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(var(--safe-bottom) + 90px);
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--bg);
    font-family: var(--mono);
    font-size: 12px;
    padding: 10px 16px;
    border-radius: 999px;
    box-shadow: var(--shadow-lift);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 110;
    letter-spacing: 0.02em;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* === Confirm sheet === */
  .sheet-mask {
    position: fixed;
    inset: 0;
    background: rgba(20, 16, 10, 0.4);
    z-index: 95;
    display: none;
    animation: fadeIn 0.15s ease;
  }
  .sheet-mask.open { display: block; }
  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--card);
    border-radius: 22px 22px 0 0;
    padding: 22px 22px calc(var(--safe-bottom) + 16px);
    z-index: 96;
    transform: translateY(100%);
    transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
    box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.15);
  }
  .sheet.open { transform: translateY(0); }
  .sheet h3 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 18px;
    margin: 0 0 6px;
  }
  .sheet p {
    font-size: 12.5px;
    color: var(--ink-muted);
    margin: 0 0 18px;
    line-height: 1.6;
  }
  .sheet-actions { display: flex; gap: 10px; }
  .sheet-btn {
    flex: 1;
    appearance: none;
    border: 1px solid var(--line);
    background: var(--card-elev);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 13px;
    padding: 12px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 500;
  }
  .sheet-btn.danger {
    background: var(--danger);
    color: #fff;
    border-color: var(--danger);
  }
  .sheet-btn:active { opacity: 0.8; }

  /* === Form modal (bottom sheet, near-fullscreen) === */
  .form-mask {
    position: fixed;
    inset: 0;
    background: rgba(20, 16, 10, 0.45);
    z-index: 80;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
  }
  .form-mask.open {
    opacity: 1;
    pointer-events: auto;
  }
  .form-modal {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    top: calc(var(--safe-top) + 16px);
    background: var(--bg);
    border-radius: 22px 22px 0 0;
    z-index: 90;
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
    display: flex;
    flex-direction: column;
    box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.2);
    overflow: hidden;
  }
  .form-modal.open { transform: translateY(0); }

  .form-modal-head {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--line-soft);
    position: relative;
  }
  .form-modal-head::before {
    content: '';
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: var(--line);
  }
  .form-modal-title {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 20px;
    letter-spacing: -0.005em;
    margin: 0;
  }
  .form-close {
    appearance: none;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 0 2px;
    font-family: var(--mono);
  }
  .form-close:active { background: var(--bg-soft); }

  .form-modal-body {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 4px 4px 16px;
  }
  .form-modal-body .section + .section { border-top: 1px dashed var(--line); }

  .form-modal-foot {
    flex-shrink: 0;
    display: flex;
    gap: 10px;
    padding: 12px 18px calc(var(--safe-bottom) + 14px);
    border-top: 1px solid var(--line-soft);
    background: var(--bg);
  }
  .sheet-btn.primary {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
    font-family: var(--serif);
    font-style: italic;
    font-size: 14px;
  }

  .section-label .required {
    color: var(--danger);
    font-family: var(--mono);
    font-weight: 500;
    font-size: 10px;
    margin-left: 6px;
    letter-spacing: 0.05em;
    text-transform: none;
  }

  /* === Read-only card text === */
  .readonly-text {
    font-family: var(--mono);
    font-size: 16px;
    line-height: 1.7;
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-word;
    padding: 2px 0;
    min-height: 20px;
  }
  .readonly-text.empty {
    color: #b8ad99;
    font-style: italic;
  }

  /* === Section background blocks (problem / solution) === */
  .section-problem .readonly-text,
  .section-solution .readonly-text {
    padding: 14px 16px;
    border-radius: 8px;
    margin-top: 8px;
  }
  .section-problem .readonly-text { background: #faf0e6; }
  .section-solution .readonly-text { background: #ecf3e8; }
  .section-problem .readonly-text.empty,
  .section-solution .readonly-text.empty {
    background: transparent;
    padding: 2px 0;
  }

  /* === Filter chips === */
  .filter-bar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 2px calc(var(--safe-right) + 18px) 14px calc(var(--safe-left) + 18px);
    margin: 0 calc(0px - var(--safe-right) - 18px) 0 calc(0px - var(--safe-left) - 18px);
    scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-chip {
    flex-shrink: 0;
    appearance: none;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    letter-spacing: 0.02em;
    transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }
  .filter-chip:active { transform: scale(0.96); }
  .filter-chip.active {
    background: var(--danger);
    color: #fff;
    border-color: var(--danger);
    font-weight: 600;
  }

  /* === Card title row + category tag === */
  .card-head { padding: 14px 16px 4px; }
  .card-title-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 0 16px 12px;
  }
  .card-title {
    flex: 1;
    min-width: 0;
    margin: 0;
    font-family: var(--serif);
    font-weight: 700;
    font-size: 19px;
    line-height: 1.32;
    letter-spacing: -0.012em;
    color: var(--ink);
    word-break: break-word;
    font-variation-settings: "opsz" 24;
  }
  .card-title.empty {
    color: var(--ink-muted);
    font-weight: 500;
    font-style: italic;
  }
  .cat-tag {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: 0.03em;
    margin-top: 4px;
    white-space: nowrap;
  }
  .cat-tag.red     { background: #f0d8d4; color: #a04438; }
  .cat-tag.green   { background: #dde6d2; color: #5d7a4a; }
  .cat-tag.blue    { background: #d9e0e6; color: #4a6478; }
  .cat-tag.amber   { background: #ebdcb8; color: #7a5a25; }
  .cat-tag.neutral { background: #e8dec7; color: #6f6452; }

  /* === Form modal: title + category meta row === */
  .meta-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .title-input {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--card-elev);
    border-radius: var(--radius-sm);
    padding: 11px 13px;
    font-family: var(--serif);
    font-weight: 600;
    font-size: 17px;
    line-height: 1.4;
    color: var(--ink);
    outline: none;
    -webkit-appearance: none;
    transition: border 0.15s ease, box-shadow 0.15s ease;
  }
  .title-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(138, 109, 59, 0.12);
  }
  .title-input::placeholder {
    color: #b8ad99;
    font-family: var(--mono);
    font-weight: 400;
    font-size: 14px;
  }
  .cat-select {
    width: 100%;
    border: 1px solid var(--line);
    background-color: var(--card-elev);
    border-radius: var(--radius-sm);

<script>
(() => {
  const SUPABASE_URL = 'https://acembjwiyrmoyzlsxvsh.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_lj9wNFRdPN_BXiMqsMa2-g_nVowbuQv';

  const LEGACY_IDB_NAME = 'feedback-h5-db';

  const VIDEO_WARN_BYTES = 50 * 1024 * 1024; // 50MB

  let supabase = null;

  try {
    if (window.supabase && typeof window.supabase.createClient === 'function') {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } else {
      supabaseInitError = 'Supabase SDK 未加载';

  } catch (e) {
    supabaseInitError = e?.message || String(e);
  }

  const CATEGORIES = [
    '排名', '拓展', 'bug', '闪退', '优化建议',

    '批量操作', '筛选', '编辑', '数据看板', '查询',
    '展示', '广告位', '客户名称',

  ];
  const DEFAULT_CATEGORY = '其他';
  const CATEGORY_COLOR = {
    'bug': 'red', '闪退': 'red',
    '优化建议': 'green', '功能设置': 'green',
    '拓展': 'blue', '上架': 'blue', '下架': 'blue', '编辑': 'blue', '批量操作': 'blue', '筛选': 'blue',
    '排名': 'amber', '数据看板': 'amber', '查询': 'amber', '展示': 'amber', '广告位': 'amber', '广告类型': 'amber', '客户名称': 'amber',
    '验证码': 'neutral', '素材': 'neutral', '其他': 'neutral'
  };

  let activeFilter = 'all';
  let editingId = null;
  let state = [];
  let isLoadingRemote = false;

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function sanitizeFilename(name) {
    const base = (typeof name === 'string' && name ? name : 'file').trim();
    // Collapse any non word/dot/dash to "_". Limit length to keep paths short.
    return base.replace(/[^\w.\-]/g, '_').slice(0, 80) || 'file';
  }

  // === Media helpers (new cloud shape: { id, type:'image'|'video', url, path, name }) ===
  function mediaIsVideo(m) {
    if (!m) return false;
    if (m.type === 'video') return true;
    return typeof m.type === 'string' && m.type.startsWith('video/');
  }
  function mediaSrc(m) {
    return (m && (m.url || m.dataUrl)) || '';
  }

  // === DB row mappers (front camelCase <-> DB snake_case) ===
  function toDbRow(item) {
    return {
      id: item.id,
      title: item.title || '',
      category: item.category || DEFAULT_CATEGORY,
      description: item.problem || '',
      solution: item.solution || '',
      media: Array.isArray(item.media) ? item.media : [],
      created_at: new Date(item.createdAt || Date.now()).toISOString(),
      updated_at: new Date().toISOString()
    };
  }
  function fromDbRow(row) {
    return {
      id: row.id,
      title: row.title || '',
      category: row.category || DEFAULT_CATEGORY,
      media: Array.isArray(row.media) ? row.media : [],
      problem: row.description || '',
      solution: row.solution || '',
      createdAt: row.created_at ? new Date(row.created_at).getTime() : Date.now()
    };
  }

  // === Supabase wrappers ===
  function _assertCloud() {
    if (!supabase) throw new Error(supabaseInitError || 'Supabase 未初始化');
  }
  async function cloudGetAll() {
    _assertCloud();
    const { data, error } = await supabase
      .from(TABLE_NAME)
      .select('*')
      .order('created_at', { ascending: false });
    if (error) throw error;
    return (data || []).map(fromDbRow);
  }
  async function cloudUpsert(item) {
    _assertCloud();
    const { error } = await supabase.from(TABLE_NAME).upsert(toDbRow(item));
    if (error) throw error;
  }
  async function cloudUpsertMany(items) {
    _assertCloud();
    if (!items.length) return;
    const { error } = await supabase.from(TABLE_NAME).upsert(items.map(toDbRow));
    if (error) throw error;
  }
  async function cloudDelete(id) {
    _assertCloud();
    const { error } = await supabase.from(TABLE_NAME).delete().eq('id', id);
    if (error) throw error;
  }
  async function cloudClear() {
    _assertCloud();
    const { error } = await supabase.from(TABLE_NAME).delete().neq('id', '__never_match__');
    if (error) throw error;
  }

  // === Storage wrappers ===
  async function storageUpload(feedbackId, fileOrBlob, originalName, mimeHint) {
    _assertCloud();
    const ts = Date.now();
    const safe = sanitizeFilename(originalName);
    const path = `${feedbackId}/${ts}-${Math.random().toString(36).slice(2, 6)}-${safe}`;
    const opts = { contentType: fileOrBlob.type || mimeHint || 'application/octet-stream', upsert: false };
    const { error } = await supabase.storage.from(STORAGE_BUCKET).upload(path, fileOrBlob, opts);
    if (error) throw error;
    const { data } = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(path);
    return { url: data.publicUrl, path };
  }
  async function storageRemove(paths) {
    if (!supabase) return;
    const valid = (paths || []).filter(p => typeof p === 'string' && p);
    if (valid.length === 0) return;
    const { error } = await supabase.storage.from(STORAGE_BUCKET).remove(valid);
    if (error) throw error;
  }

  // === Legacy IndexedDB detection (read-only; used to prompt user to import) ===
  async function legacyIDBCount() {
    if (!('indexedDB' in window)) return 0;
    try {
      if (typeof indexedDB.databases === 'function') {
        const dbs = await indexedDB.databases();
        if (!dbs.some(d => d.name === LEGACY_IDB_NAME)) return 0;
      }
    } catch (_) { /* fall through */ }
    return new Promise((resolve) => {
      let settled = false;
      const finish = (n) => { if (!settled) { settled = true; resolve(n); } };
      let req;
      try {
        req = indexedDB.open(LEGACY_IDB_NAME);
      } catch (e) { return finish(0); }
      req.onerror = () => finish(0);
      req.onsuccess = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(LEGACY_IDB_STORE)) {
          db.close();
          return finish(0);
        }
        try {
          const t = db.transaction(LEGACY_IDB_STORE, 'readonly');
          const r = t.objectStore(LEGACY_IDB_STORE).count();
          r.onsuccess = () => { db.close(); finish(r.result || 0); };
          r.onerror = () => { db.close(); finish(0); };
        } catch (e) {
          db.close(); finish(0);
        }
      };
    });
  }
  async function legacyIDBGetAll() {
    if (!('indexedDB' in window)) return [];
    return new Promise((resolve) => {
      const req = indexedDB.open(LEGACY_IDB_NAME);
      req.onerror = () => resolve([]);
      req.onsuccess = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(LEGACY_IDB_STORE)) {
          db.close(); return resolve([]);
        }
        const t = db.transaction(LEGACY_IDB_STORE, 'readonly');
        const r = t.objectStore(LEGACY_IDB_STORE).getAll();
        r.onsuccess = () => { db.close(); resolve(r.result || []); };
        r.onerror = () => { db.close(); resolve([]); };
      };
    });
  }
  async function clearLegacyIDB() {
    return new Promise((res, rej) => {
      const req = indexedDB.deleteDatabase(LEGACY_IDB_NAME);
      req.onsuccess = () => res();
      req.onerror = () => rej(req.error);
      req.onblocked = () => rej(new Error('数据库被阻塞，请关闭其他打开本页的标签后重试'));
    });
  }

  // === Normalization ===
  function migrateCategory(cat) {
    if (typeof cat !== 'string' || !cat) return DEFAULT_CATEGORY;
    if (cat === '年排名') return '排名'; // legacy rename
    return CATEGORIES.includes(cat) ? cat : DEFAULT_CATEGORY;
  }

  // Accept both old (dataUrl, MIME type) and new (url, path, simplified type) media shapes.
  function normalizeMedia(m) {
    if (!m || typeof m !== 'object') return null;
    const url = typeof m.url === 'string' ? m.url : '';
    const dataUrl = typeof m.dataUrl === 'string' ? m.dataUrl : '';
    if (!url && !dataUrl) return null;
    let type = 'image';
    if (m.type === 'video' || (typeof m.type === 'string' && m.type.startsWith('video/'))) type = 'video';
    else if (m.type === 'image' || (typeof m.type === 'string' && m.type.startsWith('image/'))) type = 'image';
    const out = {
      id: typeof m.id === 'string' && m.id ? m.id : uid(),
      type,
      name: typeof m.name === 'string' ? m.name : '',
      url,
      path: typeof m.path === 'string' ? m.path : ''
    };
    if (!url && dataUrl) out.dataUrl = dataUrl; // preserved for import-time re-upload
    return out;
  }

  // Accepts both internal shape (problem) and import shape (description).
  function normalizeItem(it) {
    if (!it || typeof it !== 'object') it = {};
    const media = Array.isArray(it.media) ? it.media.map(normalizeMedia).filter(Boolean) : [];
    const problem = typeof it.problem === 'string' ? it.problem
                  : typeof it.description === 'string' ? it.description
                  : '';
    return {
      id: typeof it.id === 'string' && it.id ? it.id : uid(),
      title: typeof it.title === 'string' ? it.title : '',
      category: migrateCategory(it.category),
      media,
      problem,
      solution: typeof it.solution === 'string' ? it.solution : '',
      createdAt: typeof it.createdAt === 'number'
        ? it.createdAt
        : (typeof it.created_at === 'string' ? new Date(it.created_at).getTime() : Date.now())
    };
  }

  // === Render ===
  const listEl = document.getElementById('feedback-list');
  const emptyEl = document.getElementById('empty-state');
  const metaInfoEl = document.getElementById('meta-info');
  const filterBarEl = document.getElementById('filter-bar');
  const bannerEl = document.getElementById('banner');
  const emptyTitleEl = emptyEl.querySelector('h2');
  const emptyDescEl = emptyEl.querySelector('p');

  function countMedia() {
    let n = 0;
    state.forEach(it => { n += (it.media || []).length; });
    return n;
  }

  function updateMetaInfo() {
    const mediaCount = countMedia();
    metaInfoEl.textContent = `已记录 ${state.length} 条 · ${mediaCount} 个媒体 · 云端`;
  }

  // === Banner ===
  let _bannerOnClick = null;
  function showBanner({ text, variant = 'info', onClick = null }) {
    bannerEl.textContent = text;
    bannerEl.className = 'banner ' + variant;
    bannerEl.hidden = false;
    _bannerOnClick = onClick;
  }
  function hideBanner() {
    bannerEl.hidden = true;
    bannerEl.className = 'banner';
    bannerEl.textContent = '';
    _bannerOnClick = null;
  }
  bannerEl.addEventListener('click', () => {
    if (typeof _bannerOnClick === 'function') _bannerOnClick();
  });

  // === Loading state (initial bootstrap) ===
  function showLoadingState() {
    listEl.innerHTML = '';
    emptyTitleEl.textContent = '加载中…';
    emptyDescEl.textContent = '正在从云端获取最新反馈';
    emptyEl.hidden = false;
  }

  function getCategoryOf(item) {
    return (item.category && CATEGORIES.includes(item.category)) ? item.category : DEFAULT_CATEGORY;
  }

  function getUsedCategories() {
    const seen = new Set(state.map(getCategoryOf));
    return CATEGORIES.filter(c => seen.has(c));
  }

  function getVisibleItems() {
    if (activeFilter === 'all') return state;
    return state.filter(it => getCategoryOf(it) === activeFilter);
  }

  function renderFilterBar() {
    const used = getUsedCategories();
    if (used.length === 0) {
      filterBarEl.innerHTML = '';
      filterBarEl.hidden = true;
      return;
    }
    filterBarEl.hidden = false;
    const chips = [{ key: 'all', label: '全部' }, ...used.map(c => ({ key: c, label: c }))];
    filterBarEl.innerHTML = chips.map(c =>
      `<button class="filter-chip${activeFilter === c.key ? ' active' : ''}" data-filter="${escapeAttr(c.key)}">${escapeAttr(c.label)}</button>`
    ).join('');
    filterBarEl.querySelectorAll('[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        activeFilter = btn.dataset.filter;
        render();
      });
    });
  }

  function render() {
    updateMetaInfo();
    // Reset filter if current selection no longer has any items
    if (activeFilter !== 'all' && !state.some(it => getCategoryOf(it) === activeFilter)) {
      activeFilter = 'all';
    }
    renderFilterBar();
    const visible = getVisibleItems();
    if (state.length === 0) {
      listEl.innerHTML = '';
      emptyTitleEl.textContent = '还没有反馈';
      emptyDescEl.textContent = '点击下方按钮添加第一条';
      emptyEl.hidden = false;
      return;
    }
    if (visible.length === 0) {
      listEl.innerHTML = '';
      emptyTitleEl.textContent = '当前类型下还没有反馈';
      emptyDescEl.textContent = '试试切换上方的「全部」筛选';
      emptyEl.hidden = false;
      return;
    }
    emptyEl.hidden = true;
    listEl.innerHTML = visible.map(item => renderCard(item, state.indexOf(item))).join('');
    bindCardEvents();
  }

  function renderCard(item, i) {
    const hasProblem = item.problem && item.problem.trim();
    const hasSolution = item.solution && item.solution.trim();
    const title = (item.title || '').trim();
    const category = getCategoryOf(item);
    const titleDisplay = title || '未命名反馈';
    const titleEmptyClass = title ? '' : ' empty';
    const colorClass = CATEGORY_COLOR[category] || 'neutral';
    return `
      <article class="card" data-id="${item.id}">
        <div class="card-head">
          <div class="card-index">No.${String(i + 1).padStart(2, '0')} <span>${formatTime(item.createdAt)}</span></div>
          <div class="card-actions">
            <button class="card-icon-btn" data-action="edit-card" aria-label="编辑" title="编辑">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
            <button class="card-icon-btn danger" data-action="delete-card" aria-label="删除" title="删除">删除</button>
          </div>
        </div>
        <div class="card-title-row">
          <h3 class="card-title${titleEmptyClass}">${escapeAttr(titleDisplay)}</h3>
          <span class="cat-tag ${colorClass}">${escapeAttr(category)}</span>
        </div>

        <section class="section">
          <div class="section-label"><span class="dot dot-media"></span> 截图 / 视频</div>
          ${item.media.length === 0
            ? `<div class="readonly-text empty">无</div>`
            : `<div class="media-grid">${item.media.map(m => renderTileReadonly(m)).join('')}</div>`}
        </section>

        <section class="section section-problem">
          <div class="section-label"><span class="dot dot-problem"></span> 问题描述</div>
          <div class="readonly-text${hasProblem ? '' : ' empty'}">${hasProblem ? escapeAttr(item.problem) : '无'}</div>
        </section>

        <section class="section section-solution">
          <div class="section-label"><span class="dot dot-solution"></span> 解决方案</div>
          <div class="readonly-text${hasSolution ? '' : ' empty'}">${hasSolution ? escapeAttr(item.solution) : '无'}</div>
        </section>
      </article>
    `;
  }

  function renderTileReadonly(m) {
    const src = mediaSrc(m);
    const inner = mediaIsVideo(m)
      ? `<video src="${src}" muted playsinline preload="metadata"></video><span class="video-badge">VIDEO</span>`
      : `<img src="${src}" alt="${escapeAttr(m.name || '')}" loading="lazy" />`;
    return `
      <div class="media-tile" data-action="preview-media" data-media-id="${m.id}">
        ${inner}
      </div>
    `;
  }

  function escapeAttr(s) {
    return String(s || '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;');
  }

  function formatTime(ts) {
    const d = new Date(ts);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  // === Card events (read-only: edit + delete + preview) ===
  function bindCardEvents() {
    listEl.querySelectorAll('.card').forEach(cardEl => {
      const id = cardEl.dataset.id;

      cardEl.querySelector('[data-action="edit-card"]').addEventListener('click', () => {
        const item = state.find(it => it.id === id);
        if (!item) return;
        openForm(item);
      });

      cardEl.querySelector('[data-action="delete-card"]').addEventListener('click', () => {
        confirmSheet('删除这条反馈？', '该条目下的截图、文字将一并移除，且无法恢复。', async () => {
          const item = state.find(it => it.id === id);
          const paths = (item?.media || []).map(m => m.path).filter(Boolean);
          try {
            await cloudDelete(id);
          } catch (e) {
            toast('删除失败：' + (e?.message || e));
            return;
          }
          // Best-effort: remove associated storage files. Don't block UI on failure.
          if (paths.length > 0) {
            storageRemove(paths).catch(err => console.warn('storage cleanup failed', err));
          }
          state = state.filter(it => it.id !== id);
          render();
          toast('已删除');
        });
      });

      cardEl.querySelectorAll('[data-action="preview-media"]').forEach(tile => {
        tile.addEventListener('click', () => {
          const mediaId = tile.dataset.mediaId;
          const item = state.find(it => it.id === id);
          if (!item) return;
          const media = item.media.find(m => m.id === mediaId);
          if (media) openPreview(media);
        });
      });
    });
  }

  function readAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(r.error);
      r.readAsDataURL(file);
    });
  }

  // === Preview modal ===
  const modal = document.getElementById('modal');
  const modalContent = document.getElementById('modal-content');

  function openPreview(media) {
    const src = mediaSrc(media);
    modalContent.innerHTML = mediaIsVideo(media)
      ? `<video src="${src}" controls autoplay playsinline></video>
         <button class="modal-close" id="modal-close-btn">关闭</button>`
      : `<img src="${src}" alt="" />
         <button class="modal-close" id="modal-close-btn">关闭</button>`;
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.getElementById('modal-close-btn').addEventListener('click', closePreview);
  }
  function closePreview() {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    modalContent.innerHTML = '';
  }
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closePreview();
  });

  // === Confirm sheet ===
  const sheet = document.getElementById('sheet');
  const sheetMask = document.getElementById('sheet-mask');
  const sheetTitle = document.getElementById('sheet-title');
  const sheetDesc = document.getElementById('sheet-desc');
  const sheetConfirm = document.getElementById('sheet-confirm');
  const sheetCancel = document.getElementById('sheet-cancel');
  let sheetConfirmCb = null;
  let sheetCancelCb = null;

  function confirmSheet(title, desc, onConfirm, onCancel = null) {
    sheetTitle.textContent = title;
    sheetDesc.textContent = desc;
    sheetConfirmCb = onConfirm;
    sheetCancelCb = onCancel;
    sheet.classList.add('open');
    sheetMask.classList.add('open');
  }
  function dismissSheet(confirmed) {
    const cb = confirmed ? sheetConfirmCb : sheetCancelCb;
    sheetConfirmCb = null;
    sheetCancelCb = null;
    sheet.classList.remove('open');
    sheetMask.classList.remove('open');
    if (typeof cb === 'function') cb();
  }
  sheetCancel.addEventListener('click', () => dismissSheet(false));
  sheetMask.addEventListener('click', () => dismissSheet(false));
  sheetConfirm.addEventListener('click', () => dismissSheet(true));

  function confirmPromise(title, desc) {
    return new Promise(resolve => {
      confirmSheet(title, desc, () => resolve(true), () => resolve(false));
    });
  }

  // === Action sheet (multi-option menu) ===
  const actionSheet = document.getElementById('action-sheet');
  const actionMask = document.getElementById('action-mask');
  const actionSheetTitle = document.getElementById('action-sheet-title');
  const actionSheetDesc = document.getElementById('action-sheet-desc');
  const actionSheetItems = document.getElementById('action-sheet-items');
  const actionSheetCancel = document.getElementById('action-sheet-cancel');

  function openActionSheet({ title, desc = '', actions }) {
    actionSheetTitle.textContent = title;
    actionSheetDesc.textContent = desc;
    actionSheetDesc.style.display = desc ? '' : 'none';
    actionSheetItems.innerHTML = actions.map((a, i) => {
      const cls = a.variant === 'danger' ? 'danger' : (a.variant === 'primary' ? 'primary' : '');
      return `<button class="sheet-btn ${cls}" data-action-idx="${i}">${escapeAttr(a.label)}</button>`;
    }).join('');
    actionSheetItems.querySelectorAll('[data-action-idx]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.actionIdx, 10);
        closeActionSheet();
        const a = actions[idx];
        if (a && typeof a.onTap === 'function') a.onTap();
      });
    });
    actionSheet.classList.add('open');
    actionMask.classList.add('open');
    actionSheet.setAttribute('aria-hidden', 'false');
  }
  function closeActionSheet() {
    actionSheet.classList.remove('open');
    actionMask.classList.remove('open');
    actionSheet.setAttribute('aria-hidden', 'true');
    actionSheetItems.innerHTML = '';
  }
  actionSheetCancel.addEventListener('click', closeActionSheet);
  actionMask.addEventListener('click', closeActionSheet);

  // === Toast ===
  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  // === Add / edit form modal ===
  let draft = { media: [] };
  let formOriginal = null; // snapshot for dirty-check
  let formFeedbackId = null; // id used for media uploads (existing for edit, new uid for add)
  let formUploadsThisSession = []; // paths uploaded during this session — cleaned up on cancel
  let formRemovesPending = []; // paths whose media items were removed — committed on submit
  let formUploadInflight = 0;
  const formMask = document.getElementById('form-mask');
  const formModal = document.getElementById('form-modal');
  const formModalTitle = document.getElementById('form-modal-title');
  const formSubmitBtn = document.getElementById('form-submit');
  const formMediaGrid = document.getElementById('form-media-grid');
  const formTitle = document.getElementById('form-title');
  const formCategory = document.getElementById('form-category');
  const formProblem = document.getElementById('form-problem');
  const formSolution = document.getElementById('form-solution');

  // Populate category select once.
  formCategory.innerHTML = CATEGORIES.map(c =>
    `<option value="${escapeAttr(c)}"${c === DEFAULT_CATEGORY ? ' selected' : ''}>${escapeAttr(c)}</option>`
  ).join('');

  function snapshotForm() {
    return {
      title: formTitle.value,
      category: formCategory.value,
      problem: formProblem.value,
      solution: formSolution.value,
      mediaIds: draft.media.map(m => m.id)
    };
  }

  function openForm(item) {
    formUploadsThisSession = [];
    formRemovesPending = [];
    formUploadInflight = 0;
    if (item) {
      editingId = item.id;
      formFeedbackId = item.id;
      formTitle.value = item.title || '';
      formCategory.value = CATEGORIES.includes(item.category) ? item.category : DEFAULT_CATEGORY;
      formProblem.value = item.problem || '';
      formSolution.value = item.solution || '';
      draft = { media: (item.media || []).map(m => ({ ...m })) };
      formModalTitle.textContent = '编辑反馈';
      formSubmitBtn.textContent = '保存修改';
    } else {
      editingId = null;
      formFeedbackId = uid();
      formTitle.value = '';
      formCategory.value = DEFAULT_CATEGORY;
      formProblem.value = '';
      formSolution.value = '';
      draft = { media: [] };
      formModalTitle.textContent = '新增反馈';
      formSubmitBtn.textContent = '提交反馈';
    }
    renderFormMedia();
    formOriginal = snapshotForm();
    formMask.classList.add('open');
    formModal.classList.add('open');
    formModal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closeForm() {
    formMask.classList.remove('open');
    formModal.classList.remove('open');
    formModal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    editingId = null;
    formFeedbackId = null;
    formOriginal = null;
    formUploadsThisSession = [];
    formRemovesPending = [];
    formUploadInflight = 0;
  }

  // Cleanup orphaned uploads when user cancels.
  async function cleanupOrphanedUploads() {
    if (formUploadsThisSession.length === 0) return;
    const paths = formUploadsThisSession.slice();
    formUploadsThisSession = [];
    try {
      await storageRemove(paths);
    } catch (e) {
      console.warn('cleanup orphans failed', e);
    }
  }

  function formIsDirty() {
    if (!formOriginal) return false;
    if (formTitle.value !== formOriginal.title) return true;
    if (formCategory.value !== formOriginal.category) return true;
    if (formProblem.value !== formOriginal.problem) return true;
    if (formSolution.value !== formOriginal.solution) return true;
    const curr = draft.media.map(m => m.id);
    if (curr.length !== formOriginal.mediaIds.length) return true;
    for (let i = 0; i < curr.length; i++) {
      if (curr[i] !== formOriginal.mediaIds[i]) return true;
    }
    return false;
  }

  function attemptCloseForm() {
    if (formUploadInflight > 0) {
      toast('正在上传媒体，请稍候');
      return;
    }
    if (formIsDirty()) {
      const msg = editingId ? '放弃本次修改？' : '放弃这条反馈？';
      confirmSheet(msg, '已填写或改动的内容将不会保存。', async () => {
        await cleanupOrphanedUploads();
        closeForm();
      });
    } else {
      // No changes to commit, but there may still be one-tap-uploaded media to clean.
      cleanupOrphanedUploads().finally(closeForm);
    }
  }

  async function submitForm() {
    if (formUploadInflight > 0) {
      toast('正在上传媒体，请稍候');
      return;
    }
    const title = formTitle.value.trim();
    const problem = formProblem.value.trim();
    if (!title) {
      toast('请填写问题标题');
      formTitle.focus();
      return;
    }
    if (!problem) {
      toast('请填写问题描述');
      formProblem.focus();
      return;
    }
    const category = CATEGORIES.includes(formCategory.value) ? formCategory.value : DEFAULT_CATEGORY;
    const wasEditing = !!editingId;
    const id = wasEditing ? editingId : formFeedbackId;
    const existing = wasEditing ? state.find(it => it.id === editingId) : null;
    const item = {
      id,
      title,
      category,
      media: draft.media.map(m => ({ id: m.id, type: m.type, url: m.url, path: m.path, name: m.name })),
      problem,
      solution: formSolution.value.trim(),
      createdAt: existing ? existing.createdAt : Date.now()
    };

    formSubmitBtn.disabled = true;
    formSubmitBtn.textContent = '保存中…';
    try {
      await cloudUpsert(item);
    } catch (e) {
      formSubmitBtn.disabled = false;
      formSubmitBtn.textContent = wasEditing ? '保存修改' : '提交反馈';
      toast('保存失败：' + (e?.message || e));
      return; // keep modal open with input intact
    }
    formSubmitBtn.disabled = false;
    formSubmitBtn.textContent = wasEditing ? '保存修改' : '提交反馈';

    // Commit pending removals (best-effort).
    if (formRemovesPending.length > 0) {
      const paths = formRemovesPending.slice();
      formRemovesPending = [];
      storageRemove(paths).catch(err => console.warn('storage remove failed', err));
    }
    // Uploads committed: don't clean.
    formUploadsThisSession = [];

    if (wasEditing) {
      const idx = state.findIndex(it => it.id === editingId);
      if (idx >= 0) state[idx] = item;
      else state.unshift(item);
    } else {
      state.unshift(item); // newest first to match cloud order
    }
    render();
    closeForm();
    toast(wasEditing ? '已保存修改' : '已添加');
  }

  // === Image compression (returns Blob for upload) ===
  function loadImage(src) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = () => rej(new Error('图片加载失败'));
      img.src = src;
    });
  }

  function canvasToBlob(canvas, type, quality) {
    return new Promise((res, rej) => {
      canvas.toBlob((blob) => {
        if (blob) res(blob);
        else rej(new Error('canvas.toBlob 失败'));
      }, type, quality);
    });
  }

  async function compressImage(file) {
    // Skip GIF (animation) and SVG (vector) — keep original blob.
    if (file.type === 'image/gif' || file.type === 'image/svg+xml') {
      return { blob: file, type: file.type, name: file.name };
    }
    let objectUrl = null;
    try {
      objectUrl = URL.createObjectURL(file);
      const img = await loadImage(objectUrl);
      if (img.naturalWidth <= IMG_MAX_DIM && img.naturalHeight <= IMG_MAX_DIM) {
        return { blob: file, type: file.type, name: file.name };
      }
      const ratio = Math.min(IMG_MAX_DIM / img.naturalWidth, IMG_MAX_DIM / img.naturalHeight);
      const w = Math.round(img.naturalWidth * ratio);
      const h = Math.round(img.naturalHeight * ratio);
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const blob = await canvasToBlob(canvas, 'image/jpeg', IMG_QUALITY);
      const baseName = (file.name || 'image').replace(/\.[^.]+$/, '');
      return { blob, type: 'image/jpeg', name: baseName + '.jpg' };
    } catch (e) {
      return { blob: file, type: file.type, name: file.name };
    } finally {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
    }
  }

  function setFormUploadingState(delta) {
    formUploadInflight += delta;
    const mediaAdd = formMediaGrid.querySelector('.media-add');
    if (mediaAdd) mediaAdd.classList.toggle('uploading', formUploadInflight > 0);
    formSubmitBtn.disabled = formUploadInflight > 0;
  }

  async function addMediaFile(f) {
    const isImage = f.type.startsWith('image/');
    const isVideo = f.type.startsWith('video/');
    if (!isImage && !isVideo) {
      toast('不支持的文件类型：' + (f.type || '未知'));
      return;
    }
    if (isVideo && f.size > VIDEO_WARN_BYTES) {
      const sizeMB = (f.size / 1024 / 1024).toFixed(1);
      const ok = await confirmPromise(
        `视频 ${sizeMB}MB，继续上传？`,
        '超过 50MB 的视频会显著增大存储与流量占用。'
      );
      if (!ok) return;
    }

    setFormUploadingState(+1);
    try {
      let blob = f, name = f.name, mime = f.type;
      if (isImage) {
        const r = await compressImage(f);
        blob = r.blob; name = r.name; mime = r.type;
      }
      const { url, path } = await storageUpload(formFeedbackId, blob, name, mime);
      draft.media.push({
        id: uid(),
        type: isVideo ? 'video' : 'image',
        url,
        path,
        name
      });
      formUploadsThisSession.push(path);
    } catch (e) {
      toast('上传失败：' + (e?.message || e));
    } finally {
      setFormUploadingState(-1);
    }
  }

  function renderFormMedia() {
    const tiles = draft.media.map(m => {
      const src = mediaSrc(m);
      const inner = mediaIsVideo(m)
        ? `<video src="${src}" muted playsinline preload="metadata"></video><span class="video-badge">VIDEO</span>`
        : `<img src="${src}" alt="${escapeAttr(m.name || '')}" />`;
      return `
        <div class="media-tile" data-action="form-preview" data-media-id="${m.id}">
          ${inner}
          <button class="media-remove" data-action="form-remove" data-media-id="${m.id}" aria-label="删除">×</button>
        </div>
      `;
    }).join('');
    formMediaGrid.innerHTML = tiles + `
      <label class="media-add${formUploadInflight > 0 ? ' uploading' : ''}">
        <input type="file" accept="image/*,video/*" multiple id="form-media-input" />
        +
      </label>
    `;

    formMediaGrid.querySelectorAll('[data-action="form-preview"]').forEach(tile => {
      tile.addEventListener('click', (e) => {
        if (e.target.closest('[data-action="form-remove"]')) return;
        const m = draft.media.find(x => x.id === tile.dataset.mediaId);
        if (m) openPreview(m);
      });
    });
    formMediaGrid.querySelectorAll('[data-action="form-remove"]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const removed = draft.media.find(m => m.id === btn.dataset.mediaId);
        draft.media = draft.media.filter(m => m.id !== btn.dataset.mediaId);
        if (removed && removed.path) {
          // Decide cleanup vs. pending-removal:
          // - If just uploaded this session, immediate cleanup is safe (not yet referenced anywhere)
          // - Otherwise we'll commit removal on submit (still referenced by old DB row)
          const sessionIdx = formUploadsThisSession.indexOf(removed.path);
          if (sessionIdx >= 0) {
            formUploadsThisSession.splice(sessionIdx, 1);
            storageRemove([removed.path]).catch(err => console.warn(err));
          } else {
            formRemovesPending.push(removed.path);
          }
        }
        renderFormMedia();
      });
    });
    const input = document.getElementById('form-media-input');
    input.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []);
      e.target.value = '';
      for (const f of files) {
        await addMediaFile(f);
        renderFormMedia();
      }
    });
  }

  document.getElementById('btn-add').addEventListener('click', () => openForm(null));
  document.getElementById('form-close').addEventListener('click', attemptCloseForm);
  document.getElementById('form-cancel').addEventListener('click', attemptCloseForm);
  formSubmitBtn.addEventListener('click', submitForm);
  // Intentionally do NOT close on mask click — avoid accidental input loss.

  // === Clear ===
  document.getElementById('btn-clear').addEventListener('click', () => {
    if (state.length === 0) {
      toast('当前没有内容');
      return;
    }
    confirmSheet('清空全部反馈？', '云端所有反馈条目、截图、视频都将被永久删除，所有人都将看到清空结果。', async () => {
      // Collect storage paths first (to clean after row delete).
      const allPaths = [];
      state.forEach(it => (it.media || []).forEach(m => { if (m.path) allPaths.push(m.path); }));
      try {
        await cloudClear();
      } catch (e) {
        toast('清空失败：' + (e?.message || e));
        return;
      }
      if (allPaths.length > 0) {
        storageRemove(allPaths).catch(err => console.warn('storage clear failed', err));
      }
      state = [];
      render();
      toast('已清空');
    });
  });

  // === Export / Backup / Import menu ===
  document.getElementById('btn-export').addEventListener('click', () => {
    openActionSheet({
      title: '导出 / 备份',
      desc: '选择一种方式保存或恢复数据',
      actions: [
        { label: '导出 Markdown', onTap: exportMarkdown },
        { label: '导出 Excel', onTap: exportExcel },
        { label: '导出 PDF', onTap: exportPDF },
        { label: '备份 JSON', onTap: backupJson },
        { label: '导入备份…', onTap: triggerImport }
      ]
    });
  });

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  function exportMarkdown() {
    if (state.length === 0) { toast('当前没有内容'); return; }
    const md = buildMarkdown(state);
    const stamp = new Date().toISOString().slice(0, 10);
    downloadBlob(new Blob([md], { type: 'text/markdown;charset=utf-8' }), `feedback-${stamp}.md`);
    toast('已导出 Markdown');
  }

  function backupJson() {
    if (state.length === 0) { toast('当前没有内容'); return; }
    const json = JSON.stringify(state, null, 2);
    const stamp = new Date().toISOString().replace(/[:.]/g, '-');
    downloadBlob(new Blob([json], { type: 'application/json;charset=utf-8' }), `feedback-backup-${stamp}.json`);
    toast(`已备份 ${state.length} 条到 JSON`);
  }

  function getExportableItems() {
    // Honor the current filter; sort newest first.
    return getVisibleItems().slice().sort((a, b) => b.createdAt - a.createdAt);
  }

  // === Excel ===
  function exportExcel() {
    if (!window.XLSX) { toast('Excel 库未加载，请刷新页面'); return; }
    const items = getExportableItems();
    if (items.length === 0) { toast('当前没有内容'); return; }
    const headers = ['序号', '标题', '类型', '创建时间', '问题描述', '解决方案', '媒体数量', '媒体链接'];
    const rows = items.map((it, i) => [
      i + 1,
      (it.title || '').trim() || '未命名反馈',
      getCategoryOf(it),
      formatTime(it.createdAt),
      it.problem || '',
      it.solution || '',
      (it.media || []).length,
      (it.media || []).map(m => mediaSrc(m)).filter(Boolean).join('\n')
    ]);
    const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
    ws['!cols'] = [
      { wch: 6 }, { wch: 30 }, { wch: 10 }, { wch: 20 },
      { wch: 50 }, { wch: 50 }, { wch: 8 }, { wch: 60 }
    ];
    // Best-effort styling: SheetJS community xlsx writer ignores styles, but set anyway
    // so any style-aware fork / future version picks them up. Wrap text on long columns.
    headers.forEach((_, idx) => {
      const ref = XLSX.utils.encode_cell({ r: 0, c: idx });
      if (ws[ref]) {
        ws[ref].s = ws[ref].s || {};
        ws[ref].s.font = { bold: true };
        ws[ref].s.alignment = { vertical: 'center', horizontal: 'left' };
      }
    });
    for (let r = 1; r <= rows.length; r++) {
      [4, 5, 7].forEach(c => { // 问题描述、解决方案、媒体链接 — 启用换行
        const ref = XLSX.utils.encode_cell({ r, c });
        if (ws[ref]) {
          ws[ref].s = ws[ref].s || {};
          ws[ref].s.alignment = { wrapText: true, vertical: 'top' };
        }
      });
    }
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '反馈记录');
    const stamp = new Date().toISOString().slice(0, 10);
    try {
      XLSX.writeFile(wb, `feedback-export-${stamp}.xlsx`);
      toast('Excel 已导出');
    } catch (e) {
      toast('导出失败：' + (e?.message || e));
    }
  }

  // === PDF (html2canvas + jsPDF) ===
  function buildPdfReportHtml(items) {
    const now = formatTime(Date.now());
    const itemsHtml = items.map((it, i) => {
      const title = (it.title || '').trim() || '未命名反馈';
      const category = getCategoryOf(it);
      const colorClass = 'pdf-tag-' + (CATEGORY_COLOR[category] || 'neutral');
      const problem = (it.problem || '').trim();
      const solution = (it.solution || '').trim();
      const mediaHtml = (it.media || []).length === 0 ? '' : `
        <div class="pdf-media">
          <span class="pdf-media-label">截图 / 视频（${it.media.length}）</span>
          <div class="pdf-media-grid">
            ${it.media.map(m => {
              const src = mediaSrc(m);
              const name = m.name || '';
              if (mediaIsVideo(m)) {
                return `
                  <div class="pdf-media-video">
                    <div class="pdf-media-icon">▶</div>
                    <div class="pdf-media-name">[视频] ${escapeAttr(name)}</div>
                    <div class="pdf-media-url">${escapeAttr(src)}</div>
                  </div>
                `;
              }
              return `<img src="${escapeAttr(src)}" crossorigin="anonymous" data-url="${escapeAttr(src)}" data-name="${escapeAttr(name)}" alt="" />`;
            }).join('')}
          </div>
        </div>
      `;
      return `
        <div class="pdf-item">
          <div class="pdf-item-head">
            <span class="pdf-item-no">No.${String(i + 1).padStart(2, '0')}</span>
            <span class="pdf-tag ${colorClass}">${escapeAttr(category)}</span>
            <span class="pdf-item-time">${formatTime(it.createdAt)}</span>
          </div>
          <h2 class="pdf-item-title">${escapeAttr(title)}</h2>
          <div class="pdf-section pdf-section-problem">
            <span class="pdf-section-label">问题描述</span>
            <div class="pdf-section-text${problem ? '' : ' empty'}">${problem ? escapeAttr(problem) : '无'}</div>
          </div>
          <div class="pdf-section pdf-section-solution">
            <span class="pdf-section-label">解决方案</span>
            <div class="pdf-section-text${solution ? '' : ' empty'}">${solution ? escapeAttr(solution) : '无'}</div>
          </div>
          ${mediaHtml}
        </div>
      `;
    }).join('');
    return `
      <div class="pdf-cover">
        <div class="pdf-cover-brand">Feedback Log</div>
        <h1 class="pdf-cover-title">问题反馈记录</h1>
        <div class="pdf-cover-meta">
          <div>导出时间：${escapeAttr(now)}</div>
          <div>共 ${items.length} 条反馈</div>
        </div>
      </div>
      ${itemsHtml}
    `;
  }

  // Wait for all <img> in the container to settle (loaded or failed).
  // On error, swap the img for a fallback block so html2canvas still produces something useful.
  function waitForPdfImages(container) {
    const imgs = Array.from(container.querySelectorAll('img'));
    return Promise.all(imgs.map(img => new Promise((resolve) => {
      const finish = () => resolve();
      if (img.complete && img.naturalWidth > 0) return finish();
      let done = false;
      const settle = (failed) => {
        if (done) return;
        done = true;
        if (failed) {
          const fallback = document.createElement('div');
          fallback.className = 'pdf-media-fallback';
          fallback.innerHTML = `
            <div class="pdf-media-icon">⌧</div>
            <div class="pdf-media-name">[图片加载失败]</div>
            <div class="pdf-media-url">${escapeAttr(img.getAttribute('data-url') || img.src)}</div>
          `;
          if (img.parentNode) img.parentNode.replaceChild(fallback, img);
        }
        resolve();
      };
      img.addEventListener('load', () => settle(false));
      img.addEventListener('error', () => settle(true));
      setTimeout(() => settle(!img.complete || img.naturalWidth === 0), 10000);
    })));
  }

  async function exportPDF() {
    if (!window.html2canvas || !window.jspdf) {
      toast('PDF 库未加载，请刷新页面');
      return;
    }
    const items = getExportableItems();
    if (items.length === 0) { toast('当前没有内容'); return; }

    toast('正在生成 PDF，请稍候…');

    const container = document.createElement('div');
    container.className = 'pdf-export';
    container.innerHTML = buildPdfReportHtml(items);
    document.body.appendChild(container);

    try {
      await waitForPdfImages(container);
      const canvas = await window.html2canvas(container, {
        scale: 2,
        useCORS: true,
        allowTaint: false,
        backgroundColor: '#fbf7ec',
        logging: false,
        imageTimeout: 12000
      });
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: 'pt', format: 'a4', orientation: 'p' });
      const margin = 20;
      const pdfWidth = 595 - margin * 2;   // 555
      const pageHeight = 842 - margin * 2; // 802
      const ratio = pdfWidth / canvas.width;
      const sliceHeightPx = Math.floor(pageHeight / ratio);

      let offsetY = 0;
      let firstPage = true;
      while (offsetY < canvas.height) {
        if (!firstPage) pdf.addPage();
        firstPage = false;
        const sliceCanvas = document.createElement('canvas');
        const remaining = canvas.height - offsetY;
        sliceCanvas.width = canvas.width;
        sliceCanvas.height = Math.min(sliceHeightPx, remaining);
        const sctx = sliceCanvas.getContext('2d');
        sctx.drawImage(canvas, 0, offsetY, canvas.width, sliceCanvas.height, 0, 0, canvas.width, sliceCanvas.height);
        const imgData = sliceCanvas.toDataURL('image/jpeg', 0.85);
        pdf.addImage(imgData, 'JPEG', margin, margin, pdfWidth, sliceCanvas.height * ratio);
        offsetY += sliceCanvas.height;
      }
      const stamp = new Date().toISOString().slice(0, 10);
      pdf.save(`feedback-report-${stamp}.pdf`);
      toast('PDF 已导出');
    } catch (e) {
      console.error('PDF export failed', e);
      toast('导出失败：' + (e?.message || e));
    } finally {
      if (container.parentNode) container.parentNode.removeChild(container);
    }
  }

  const importFileInput = document.getElementById('import-file-input');
  function triggerImport() {
    importFileInput.value = '';
    importFileInput.click();
  }
  importFileInput.addEventListener('change', async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    let parsed;
    try {
      const text = await file.text();
      parsed = JSON.parse(text);
    } catch (err) {
      toast('JSON 解析失败：' + err.message);
      return;
    }
    if (!Array.isArray(parsed)) {
      toast('备份文件格式不对（应为数组）');
      return;
    }
    const items = parsed.map(normalizeItem);
    if (items.length === 0) {
      toast('备份文件里没有数据');
      return;
    }
    openActionSheet({
      title: `导入 ${items.length} 条反馈`,
      desc: '选择导入方式',
      actions: [
        { label: '合并追加', variant: 'primary', onTap: () => doImport('merge', items) },
        { label: '替换全部', variant: 'danger', onTap: () => doImport('replace', items) }
      ]
    });
  });

  async function dataUrlToBlob(dataUrl) {
    const r = await fetch(dataUrl);
    return r.blob();
  }

  // Re-uploads any media entries that still carry a base64 dataUrl (legacy backups).
  // Mutates `items` in place. Returns the number of media uploaded.
  async function uploadLegacyMediaInItems(items) {
    let total = 0;
    items.forEach(it => (it.media || []).forEach(m => { if (m && !m.url && m.dataUrl) total++; }));
    if (total === 0) return 0;
    let done = 0;
    showBanner({ text: `正在上传媒体 ${done}/${total}…`, variant: 'info' });
    for (const item of items) {
      if (!Array.isArray(item.media)) continue;
      for (let i = 0; i < item.media.length; i++) {
        const m = item.media[i];
        if (!m || m.url || !m.dataUrl) continue;
        try {
          const blob = await dataUrlToBlob(m.dataUrl);
          const isVideo = (m.type === 'video') || (typeof m.type === 'string' && m.type.startsWith('video/'));
          const mime = blob.type || (isVideo ? 'video/mp4' : 'image/jpeg');
          const name = m.name || (isVideo ? 'video' : 'image');
          const { url, path } = await storageUpload(item.id, blob, name, mime);
          item.media[i] = { id: m.id || uid(), type: isVideo ? 'video' : 'image', url, path, name };
          done++;
          showBanner({ text: `正在上传媒体 ${done}/${total}…`, variant: 'info' });
        } catch (e) {
          // Toast specific error and continue (don't roll back successful uploads).
          toast(`媒体上传失败：${e?.message || e}`);
          // Drop this media item so the row can still be saved.
          item.media[i] = null;
        }
      }
      item.media = item.media.filter(Boolean);
    }
    return done;
  }

  async function doImport(mode, items) {
    let mediaUploaded = 0;
    try {
      mediaUploaded = await uploadLegacyMediaInItems(items);
      if (mode === 'replace') {
        // Collect existing paths to remove from storage after row clear.
        const oldPaths = [];
        state.forEach(it => (it.media || []).forEach(m => { if (m.path) oldPaths.push(m.path); }));
        await cloudClear();
        if (oldPaths.length > 0) {
          storageRemove(oldPaths).catch(err => console.warn(err));
        }
      }
      await cloudUpsertMany(items);
      state = await cloudGetAll();
    } catch (e) {
      hideBanner();
      toast('导入失败：' + (e?.message || e));
      return;
    }
    hideBanner();
    render();
    toast(`已导入 ${items.length} 条反馈，上传 ${mediaUploaded} 个媒体文件`);
  }

  function buildMarkdown(items) {
    const lines = [];
    const now = new Date();
    lines.push(`# 问题反馈`);
    lines.push('');
    lines.push(`> 生成于 ${formatTime(now.getTime())} · 共 ${items.length} 条`);
    lines.push('');
    items.forEach((item, i) => {
      const title = (item.title || '').trim() || '未命名反馈';
      const category = getCategoryOf(item);
      lines.push(`## No.${String(i + 1).padStart(2, '0')} · [${category}] ${title}`);
      lines.push('');
      lines.push(`*${formatTime(item.createdAt)}*`);
      lines.push('');

      lines.push(`### 🟠 截图 / 视频`);
      lines.push('');
      if (item.media.length === 0) {
        lines.push('_无_');
      } else {
        item.media.forEach((m, idx) => {
          const src = mediaSrc(m);
          if (mediaIsVideo(m)) {
            lines.push(`📹 **${m.name || 'video-' + (idx + 1)}** — ${src}`);
          } else {
            lines.push(`![${m.name || 'image-' + (idx + 1)}](${src})`);
          }
          lines.push('');
        });
      }
      lines.push('');

      lines.push(`### 🔴 问题描述`);
      lines.push('');
      lines.push(item.problem.trim() || '_无_');
      lines.push('');

      lines.push(`### 🟢 解决方案`);
      lines.push('');
      lines.push(item.solution.trim() || '_无_');
      lines.push('');

      if (i < items.length - 1) {
        lines.push('---');
        lines.push('');
      }
    });
    return lines.join('\n');
  }

  // === Refresh ===
  const refreshBtn = document.getElementById('btn-refresh');
  let _suppressVisibilityRefresh = 0;

  function setRefreshing(on) {
    refreshBtn.classList.toggle('spinning', on);
    refreshBtn.disabled = on;
    isLoadingRemote = on;
  }

  async function refreshFromCloud(silent = false) {
    if (isLoadingRemote) return;
    if (!supabase) {
      if (!silent) toast('未连接服务器');
      return;
    }
    setRefreshing(true);
    try {
      state = await cloudGetAll();
      render();
      if (!silent) toast('已刷新');
    } catch (e) {
      if (!silent) toast('网络错误，请稍后重试');
      console.warn('refresh failed', e);
    } finally {
      setRefreshing(false);
    }
  }

  refreshBtn.addEventListener('click', () => refreshFromCloud(false));

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (_suppressVisibilityRefresh > Date.now()) return;
    refreshFromCloud(true);
  });

  // === Legacy IDB banner ===
  function offerLegacyClear(count) {
    showBanner({
      variant: 'warn',
      text: `检测到本地有 ${count} 条旧数据。请点「导出」按钮备份后，通过「导入备份」上传到云端；上传完成后可点此提示清理本地缓存。`,
      onClick: () => {
        confirmSheet(
          '确认本地数据已经备份并导入到云端？',
          '清理后本地缓存将被删除（仅清理本机 IndexedDB，云端不受影响）。',
          async () => {
            try {
              await clearLegacyIDB();
              hideBanner();
              toast('已清理本地缓存');
            } catch (e) {
              toast('清理失败：' + (e?.message || e));
            }
          }
        );
      }
    });
  }

  // === Bootstrap ===
  showLoadingState();

  (async () => {
    if (supabaseInitError) {
      showBanner({ variant: 'error', text: '无法连接服务器（' + supabaseInitError + '），请检查网络或刷新页面' });
      emptyTitleEl.textContent = '未连接服务器';
      emptyDescEl.textContent = '加载失败，请稍后重试';
      return;
    }

    // 1) Detect leftover IndexedDB data and show migration banner (don't auto-import).
    try {
      const legacyCount = await legacyIDBCount();
      if (legacyCount > 0) offerLegacyClear(legacyCount);
    } catch (e) {
      console.warn('legacy IDB check failed', e);
    }

    // 2) Initial cloud load
    try {
      state = await cloudGetAll();
    } catch (e) {
      console.warn('initial cloudGetAll failed', e);
      toast('网络错误，请稍后重试');
      emptyTitleEl.textContent = '加载失败';
      emptyDescEl.textContent = '点击右上「刷新」按钮重试';
      return;
    }
    render();
  })();

  // Prevent double-tap zoom on buttons / textareas while keeping pinch-zoom off in viewport.
  document.addEventListener('gesturestart', (e) => e.preventDefault());
})();
</script>
