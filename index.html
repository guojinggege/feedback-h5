<!DOCTYPE html>
<!--
  Rollback snapshots (oldest first):
    /index-old.html         localStorage 时代
    /index-pre-cloud.html   Supabase 化前
    /index-pre-export.html  Excel/PDF 加入前
    /index-pre-gantt.html   Tab + 看板加入前
    /index-pre-gantt2.html  解决进度替换为甘特图前
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="反馈" />
<meta name="theme-color" content="#f5efe1" />
<title>问题反馈</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f5efe1'/%3E%3Ctext x='50%25' y='54%25' font-family='Georgia,serif' font-size='38' text-anchor='middle' dominant-baseline='middle' fill='%23b8504a'%3EF%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23f5efe1'/%3E%3Ctext x='50%25' y='56%25' font-family='Georgia,serif' font-size='108' text-anchor='middle' dominant-baseline='middle' fill='%23b8504a'%3EF%3C/text%3E%3C/svg%3E" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
  :root {
    --bg: #f5efe1;
    --bg-soft: #efe7d4;
    --card: #fbf7ec;
    --card-elev: #ffffff;
    --ink: #2b2620;
    --ink-muted: #7a6f60;
    --line: #e6dcc4;
    --line-soft: #efe7d2;
    --dot-media: #c97a4a;
    --dot-problem: #b8504a;
    --dot-solution: #6b8e5a;
    --accent: #8a6d3b;
    --danger: #b8504a;
    --shadow: 0 1px 2px rgba(80, 60, 30, 0.04), 0 6px 18px rgba(80, 60, 30, 0.07);
    --shadow-lift: 0 2px 4px rgba(80, 60, 30, 0.06), 0 14px 32px rgba(80, 60, 30, 0.12);
    --radius: 18px;
    --radius-sm: 12px;
    --serif: 'Fraunces', 'Songti SC', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.55;
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: contain;
  }

  /* === Header === */
  .app-header {
    position: sticky;
    top: 0;
    z-index: 50;
    padding: calc(var(--safe-top) + 14px) calc(var(--safe-right) + 18px) 14px calc(var(--safe-left) + 18px);
    background: rgba(245, 239, 225, 0.88);
    backdrop-filter: saturate(150%) blur(14px);
    -webkit-backdrop-filter: saturate(150%) blur(14px);
    border-bottom: 1px solid var(--line-soft);
  }
  .app-header-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
  }
  .app-title {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 28px;
    letter-spacing: -0.01em;
    margin: 0;
    line-height: 1.1;
    font-variation-settings: "opsz" 96, "SOFT" 50;
  }
  .app-subtitle {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-muted);
    margin-top: 4px;
    letter-spacing: 0.02em;
  }
  .header-actions {
    display: flex;
    gap: 8px;
  }
  .icon-btn {
    appearance: none;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    padding: 9px 12px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .icon-btn:active { transform: scale(0.96); background: var(--bg-soft); }
  .icon-btn svg { width: 14px; height: 14px; }

  /* === Main === */
  main {
    padding: 20px calc(var(--safe-right) + 18px) calc(var(--safe-bottom) + 120px) calc(var(--safe-left) + 18px);
    max-width: 720px;
    margin: 0 auto;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-muted);
  }
  .empty-state .emoji {
    font-size: 40px;
    margin-bottom: 12px;
    font-family: var(--serif);
    color: var(--accent);
  }
  .empty-state h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 20px;
    color: var(--ink);
    margin: 0 0 6px;
  }
  .empty-state p {
    font-size: 12.5px;
    margin: 0;
    letter-spacing: 0.01em;
  }

  /* === Feedback Card === */
  .feedback-list { display: flex; flex-direction: column; gap: 18px; }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--line-soft);
    overflow: hidden;
  }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 6px;
  }
  .card-index {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 17px;
    color: var(--ink);
    font-style: italic;
    letter-spacing: 0.01em;
  }
  .card-index span {
    font-family: var(--mono);
    font-style: normal;
    font-size: 11px;
    color: var(--ink-muted);
    margin-left: 8px;
    letter-spacing: 0.04em;
  }
  .section { padding: 10px 16px 14px; }
  .section + .section { border-top: 1px dashed var(--line); }

  .section-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 8px;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.6);
  }
  .dot-media { background: var(--dot-media); }
  .dot-problem { background: var(--dot-problem); }
  .dot-solution { background: var(--dot-solution); }

  /* === Textarea === */
  textarea {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--card-elev);
    border-radius: var(--radius-sm);
    padding: 11px 13px;
    font-family: var(--mono);
    font-size: 16px;
    line-height: 1.7;
    color: var(--ink);
    resize: vertical;
    min-height: 80px;
    outline: none;
    transition: border 0.15s ease, box-shadow 0.15s ease;
    -webkit-appearance: none;
  }
  textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(138, 109, 59, 0.12);
  }
  textarea::placeholder {
    color: #b8ad99;
    font-family: var(--mono);
  }

  /* === Media grid === */
  .media-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
    gap: 8px;
  }
  .media-tile {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    overflow: hidden;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    cursor: pointer;
  }
  .media-tile img, .media-tile video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }
  .media-tile .video-badge {
    position: absolute;
    bottom: 4px;
    left: 4px;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    font-family: var(--mono);
    letter-spacing: 0.04em;
  }
  .media-remove {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    border: none;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .media-add {
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    border: 1.5px dashed var(--line);
    background: transparent;
    color: var(--ink-muted);
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 300;
    cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }
  .media-add:active {
    background: var(--bg-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .media-add input { display: none; }

  /* === Floating add button (hidden on progress tab) === */
  body.on-progress .fab-wrap { display: none; }
  .fab-wrap {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 14px calc(var(--safe-right) + 18px) calc(var(--safe-bottom) + 14px) calc(var(--safe-left) + 18px);
    background: linear-gradient(to top, rgba(245, 239, 225, 0.98) 60%, rgba(245, 239, 225, 0));
    z-index: 40;
    display: flex;
    justify-content: center;
    pointer-events: none;
  }
  .fab {
    pointer-events: auto;
    appearance: none;
    border: none;
    background: var(--ink);
    color: var(--bg);
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 500;
    padding: 14px 24px;
    border-radius: 999px;
    box-shadow: var(--shadow-lift);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.01em;
    transition: transform 0.12s ease;
    font-style: italic;
  }
  .fab:active { transform: scale(0.97); }
  .fab .plus {
    font-family: var(--mono);
    font-style: normal;
    font-size: 18px;
    font-weight: 400;
    line-height: 1;
  }

  /* === Modal / preview === */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(20, 16, 10, 0.88);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: calc(var(--safe-top) + 20px) 20px calc(var(--safe-bottom) + 20px);
    animation: fadeIn 0.18s ease;
  }
  .modal.open { display: flex; }
  .modal-content {
    max-width: 100%;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .modal-content img, .modal-content video {
    max-width: 100%;
    max-height: calc(100vh - 140px);
    max-height: calc(100dvh - 140px);
    border-radius: 12px;
    object-fit: contain;
    background: #000;
  }
  .modal-close {
    appearance: none;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.18);
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 18px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 0.04em;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* === Toast === */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(var(--safe-bottom) + 90px);
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--bg);
    font-family: var(--mono);
    font-size: 12px;
    padding: 10px 16px;
    border-radius: 999px;
    box-shadow: var(--shadow-lift);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 110;
    letter-spacing: 0.02em;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* === Confirm sheet === */
  .sheet-mask {
    position: fixed;
    inset: 0;
    background: rgba(20, 16, 10, 0.4);
    z-index: 95;
    display: none;
    animation: fadeIn 0.15s ease;
  }
  .sheet-mask.open { display: block; }
  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--card);
    border-radius: 22px 22px 0 0;
    padding: 22px 22px calc(var(--safe-bottom) + 16px);
    z-index: 96;
    transform: translateY(100%);
    transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
    box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.15);
    /* Same reason as .form-modal: closed sheet must not intercept clicks. */
    pointer-events: none;
  }
  .sheet.open {
    transform: translateY(0);
    pointer-events: auto;
  }
  .sheet h3 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 18px;
    margin: 0 0 6px;
  }
  .sheet p {
    font-size: 12.5px;
    color: var(--ink-muted);
    margin: 0 0 18px;
    line-height: 1.6;
  }
  .sheet-actions { display: flex; gap: 10px; }
  .sheet-btn {
    flex: 1;
    appearance: none;
    border: 1px solid var(--line);
    background: var(--card-elev);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 13px;
    padding: 12px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 500;
  }
  .sheet-btn.danger {
    background: var(--danger);
    color: #fff;
    border-color: var(--danger);
  }
  .sheet-btn:active { opacity: 0.8; }

  /* === Form modal (bottom sheet, near-fullscreen) === */
  .form-mask {
    position: fixed;
    inset: 0;
    background: rgba(20, 16, 10, 0.45);
    z-index: 80;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
  }
  .form-mask.open {
    opacity: 1;
    pointer-events: auto;
  }
  .form-modal {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    top: calc(var(--safe-top) + 16px);
    background: var(--bg);
    border-radius: 22px 22px 0 0;
    z-index: 90;
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
    display: flex;
    flex-direction: column;
    box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.2);
    overflow: hidden;
    /* Closed modal must not intercept clicks (critical on desktop centered mode where
       the closed modal still sits at the viewport center with opacity 0). */
    pointer-events: none;
  }
  .form-modal.open {
    transform: translateY(0);
    pointer-events: auto;
  }

  .form-modal-head {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--line-soft);
    position: relative;
  }
  .form-modal-head::before {
    content: '';
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: var(--line);
  }
  .form-modal-title {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 20px;
    letter-spacing: -0.005em;
    margin: 0;
  }
  .form-close {
    appearance: none;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 0 2px;
    font-family: var(--mono);
  }
  .form-close:active { background: var(--bg-soft); }

  .form-modal-body {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 4px 4px 16px;
  }
  .form-modal-body .section + .section { border-top: 1px dashed var(--line); }

  .form-modal-foot {
    flex-shrink: 0;
    display: flex;
    gap: 10px;
    padding: 12px 18px calc(var(--safe-bottom) + 14px);
    border-top: 1px solid var(--line-soft);
    background: var(--bg);
  }
  .sheet-btn.primary {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
    font-family: var(--serif);
    font-style: italic;
    font-size: 14px;
  }

  .section-label .required {
    color: var(--danger);
    font-family: var(--mono);
    font-weight: 500;
    font-size: 10px;
    margin-left: 6px;
    letter-spacing: 0.05em;
    text-transform: none;
  }

  /* === Read-only card text === */
  .readonly-text {
    font-family: var(--mono);
    font-size: 16px;
    line-height: 1.7;
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-word;
    padding: 2px 0;
    min-height: 20px;
  }
  .readonly-text.empty {
    color: #b8ad99;
    font-style: italic;
  }

  /* === Section background blocks (problem / solution) === */
  .section-problem .readonly-text,
  .section-solution .readonly-text {
    padding: 14px 16px;
    border-radius: 8px;
    margin-top: 8px;
  }
  .section-problem .readonly-text { background: #faf0e6; }
  .section-solution .readonly-text { background: #ecf3e8; }
  .section-problem .readonly-text.empty,
  .section-solution .readonly-text.empty {
    background: transparent;
    padding: 2px 0;
  }

  /* === Filter chips === */
  .filter-bar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 2px calc(var(--safe-right) + 18px) 14px calc(var(--safe-left) + 18px);
    margin: 0 calc(0px - var(--safe-right) - 18px) 0 calc(0px - var(--safe-left) - 18px);
    scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-chip {
    flex-shrink: 0;
    appearance: none;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    letter-spacing: 0.02em;
    transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }
  .filter-chip:active { transform: scale(0.96); }
  .filter-chip.active {
    background: var(--danger);
    color: #fff;
    border-color: var(--danger);
    font-weight: 600;
  }

  /* === Card title row + category tag === */
  .card-head { padding: 14px 16px 4px; }
  .card-title-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 0 16px 12px;
  }
  .card-title {
    flex: 1;
    min-width: 0;
    margin: 0;
    font-family: var(--serif);
    font-weight: 700;
    font-size: 19px;
    line-height: 1.32;
    letter-spacing: -0.012em;
    color: var(--ink);
    word-break: break-word;
    font-variation-settings: "opsz" 24;
  }
  .card-title.empty {
    color: var(--ink-muted);
    font-weight: 500;
    font-style: italic;
  }
  .cat-tag {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: 0.03em;
    margin-top: 4px;
    white-space: nowrap;
  }
  .cat-tag.red     { background: #f0d8d4; color: #a04438; }
  .cat-tag.green   { background: #dde6d2; color: #5d7a4a; }
  .cat-tag.blue    { background: #d9e0e6; color: #4a6478; }
  .cat-tag.amber   { background: #ebdcb8; color: #7a5a25; }
  .cat-tag.neutral { background: #e8dec7; color: #6f6452; }

  /* === Form modal: title + category meta row === */
  .meta-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .title-input {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--card-elev);
    border-radius: var(--radius-sm);
    padding: 11px 13px;
    font-family: var(--serif);
    font-weight: 600;
    font-size: 17px;
    line-height: 1.4;
    color: var(--ink);
    outline: none;
    -webkit-appearance: none;
    transition: border 0.15s ease, box-shadow 0.15s ease;
  }
  .title-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(138, 109, 59, 0.12);
  }
  .title-input::placeholder {
    color: #b8ad99;
    font-family: var(--mono);
    font-weight: 400;
    font-size: 14px;
  }
  .cat-select {
    width: 100%;
    border: 1px solid var(--line);
    background-color: var(--card-elev);
    border-radius: var(--radius-sm);
    padding: 11px 34px 11px 13px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink);
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8' fill='none'><path d='M1 1L6 6L11 1' stroke='%237a6f60' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 12px center;
    cursor: pointer;
  }
  .cat-select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(138, 109, 59, 0.12);
  }
  @media (min-width: 420px) {
    .meta-row { flex-direction: row; align-items: stretch; }
    .title-input { flex: 1; min-width: 0; }
    .cat-select { flex: 0 0 130px; width: 130px; }
  }

  /* === Card action buttons (edit + delete) === */
  .card-actions {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .card-icon-btn {
    appearance: none;
    background: transparent;
    border: none;
    color: var(--ink-muted);
    padding: 6px 8px;
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    line-height: 1;
  }
  .card-icon-btn svg {
    width: 15px;
    height: 15px;
    display: block;
  }
  .card-icon-btn:active { background: var(--bg-soft); color: var(--accent); }
  .card-icon-btn.danger:active { color: var(--danger); }

  /* === Sheet stack (vertical) variant for action menus === */
  .sheet-actions.sheet-actions-stack {
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
  }
  .sheet-actions.sheet-actions-stack .sheet-btn { flex: 0 0 auto; width: 100%; }
  .sheet-actions + .sheet-actions { margin-top: 8px; }

  /* === Banner (legacy migration / network errors) === */
  .banner {
    margin: 0 0 14px;
    padding: 12px 14px;
    border-radius: 12px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.55;
    border: 1px solid transparent;
    word-break: break-word;
  }
  .banner.warn {
    background: #f3e6cb;
    color: #7a5a25;
    border-color: #e6d4ac;
    cursor: pointer;
  }
  .banner.error {
    background: #f0d8d4;
    color: #a04438;
    border-color: #e0c4be;
  }
  .banner.info {
    background: var(--card);
    color: var(--ink);
    border-color: var(--line);
  }
  .banner:active.warn { opacity: 0.85; }

  /* === Spin animation for refresh button === */
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .icon-btn .spin-target {
    transition: transform 0.2s ease;
  }
  .icon-btn.spinning .spin-target {
    animation: spin 0.9s linear infinite;
  }
  .icon-btn:disabled,
  .icon-btn.spinning {
    opacity: 0.65;
    pointer-events: none;
  }
  .icon-btn .btn-text { display: inline; }

  /* === Media uploading state === */
  .media-add.uploading {
    opacity: 0.5;
    pointer-events: none;
    position: relative;
  }
  .media-add.uploading::after {
    content: '…';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--accent);
  }
  .media-tile.uploading::before {
    content: '上传中';
    position: absolute;
    inset: 0;
    background: rgba(20, 16, 10, 0.55);
    color: #fff;
    font-family: var(--mono);
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    letter-spacing: 0.06em;
  }

  /* === PDF report (offscreen render container) === */
  .pdf-export {
    position: absolute;
    left: -9999px;
    top: 0;
    width: 750px;
    background: #fbf7ec;
    padding: 40px 36px;
    box-sizing: border-box;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    color: #2b2620;
    -webkit-font-smoothing: antialiased;
  }
  .pdf-cover {
    text-align: center;
    padding: 24px 0 40px;
    border-bottom: 1px solid #e6dcc4;
    margin-bottom: 30px;
  }
  .pdf-cover-brand {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-size: 14px;
    color: #8a6d3b;
    letter-spacing: 0.04em;
    margin-bottom: 14px;
  }
  .pdf-cover-title {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 38px;
    font-weight: 700;
    margin: 0 0 18px;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .pdf-cover-meta {
    font-size: 12px;
    color: #7a6f60;
    line-height: 1.9;
  }
  .pdf-item {
    padding: 24px 0;
    border-bottom: 1px dashed #d8cdb2;
    page-break-inside: avoid;
  }
  .pdf-item:last-child { border-bottom: none; }
  .pdf-item-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .pdf-item-no {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    color: #2b2620;
  }
  .pdf-item-time {
    font-size: 11px;
    color: #7a6f60;
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
  }
  .pdf-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    letter-spacing: 0.03em;
  }
  .pdf-tag-red     { background: #f0d8d4; color: #a04438; }
  .pdf-tag-green   { background: #dde6d2; color: #5d7a4a; }
  .pdf-tag-blue    { background: #d9e0e6; color: #4a6478; }
  .pdf-tag-amber   { background: #ebdcb8; color: #7a5a25; }
  .pdf-tag-neutral { background: #e8dec7; color: #6f6452; }
  .pdf-item-title {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 22px;
    font-weight: 700;
    margin: 6px 0 14px;
    color: #2b2620;
    line-height: 1.3;
    letter-spacing: -0.012em;
  }
  .pdf-section {
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 10px;
    font-size: 13.5px;
    line-height: 1.7;
  }
  .pdf-section-problem  { background: #faf0e6; }
  .pdf-section-solution { background: #ecf3e8; }
  .pdf-section-label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .pdf-section-problem  .pdf-section-label { color: #a04438; }
  .pdf-section-solution .pdf-section-label { color: #5d7a4a; }
  .pdf-section-text {
    white-space: pre-wrap;
    word-break: break-word;
    color: #2b2620;
  }
  .pdf-section-text.empty {
    color: #b8ad99;
    font-style: italic;
  }
  .pdf-media {
    margin-top: 12px;
  }
  .pdf-media-label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #7a6f60;
    margin-bottom: 8px;
  }
  .pdf-media-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .pdf-media-grid img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid #e6dcc4;
    display: block;
  }
  .pdf-media-video,
  .pdf-media-fallback {
    height: 150px;
    background: #2b2620;
    color: #f5efe1;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    font-size: 10.5px;
    text-align: center;
    word-break: break-all;
    line-height: 1.5;
    font-family: 'JetBrains Mono', monospace;
  }
  .pdf-media-icon {
    font-size: 24px;
    margin-bottom: 6px;
    font-family: 'Fraunces', Georgia, serif;
  }
  .pdf-media-name {
    font-weight: 600;
    margin-bottom: 4px;
  }
  .pdf-media-url {
    font-size: 9px;
    opacity: 0.75;
    word-break: break-all;
  }

  /* === Tab bar === */
  .tab-bar {
    display: flex;
    gap: 8px;
    margin: 0 0 14px;
    padding: 4px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
  }
  .tab-btn {
    flex: 1;
    appearance: none;
    background: transparent;
    border: none;
    padding: 8px 20px;
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-muted);
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .tab-btn.active {
    background: var(--ink);
    color: #fff;
    font-weight: 600;
  }
  .tab-btn:active:not(.active) { background: var(--bg-soft); }

  .page { display: block; }
  .page[hidden] { display: none; }

  /* === Status badge === */
  .status-badge {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 999px;
    margin-top: 5px;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .status-pending     { background: #e8e3d5; color: #6b5f4d; }
  .status-progressing { background: #fce8c4; color: #8a5a1a; }
  .status-resolved    { background: #c8e6c9; color: #2e6b30; }
  .status-closed      { background: #ffcdd2; color: #8b2a2a; }

  /* === Status filter chips (smaller variant) === */
  .status-filter-bar .filter-chip {
    font-size: 11px;
    padding: 5px 10px;
  }

  /* === Form modal status row === */
  .status-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
  }
  .status-row-label {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-muted);
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }
  .status-row .cat-select { flex: 1; width: auto; }

  /* === Gantt: toolbar === */
  .gantt-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  .gantt-views {
    display: flex;
    gap: 4px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
  }
  .gantt-view-btn {
    appearance: none;
    background: transparent;
    border: none;
    padding: 6px 14px;
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-muted);
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  .gantt-view-btn.active {
    background: var(--ink);
    color: #fff;
    font-weight: 600;
  }
  .gantt-add-btn {
    appearance: none;
    background: #c8442a;
    color: #fff;
    border: none;
    padding: 9px 18px;
    border-radius: 999px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 2px 8px rgba(200, 68, 42, 0.25);
    transition: transform 0.12s ease;
  }
  .gantt-add-btn:active { transform: scale(0.97); }
  .gantt-add-btn .plus { font-family: var(--mono); font-style: normal; font-size: 16px; }

  /* === Gantt: desktop chart === */
  .gantt-chart {
    display: flex;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .gantt-sidebar {
    flex: 0 0 240px;
    border-right: 1px solid var(--line);
    background: var(--bg-soft);
  }
  .gantt-sidebar-header {
    height: 56px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-muted);
    background: var(--card);
  }
  .gantt-sidebar-rows { padding: 0; }
  .gantt-sidebar-row {
    height: 48px;
    margin: 8px 0 0;
    padding: 6px 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .gantt-sidebar-row:first-child { margin-top: 8px; }
  .gantt-sidebar-row:hover { background: rgba(0, 0, 0, 0.03); }
  .gantt-sidebar-row-title {
    font-family: var(--serif);
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-bottom: 3px;
  }
  .gantt-sidebar-row-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-muted);
    overflow: hidden;
  }
  .gantt-sidebar-row-meta .owner {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .gantt-sidebar-row-meta .badge {
    flex-shrink: 0;
    font-size: 9px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 999px;
  }

  .gantt-timeline-scroll {
    flex: 1;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
  }
  .gantt-timeline-inner {
    position: relative;
    min-width: 100%;
  }
  .gantt-ruler {
    position: relative;
    height: 56px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  .gantt-ruler-months {
    position: relative;
    height: 28px;
    border-bottom: 1px solid var(--line-soft);
  }
  .gantt-ruler-month {
    position: absolute;
    top: 0;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--ink);
    border-right: 1px solid var(--line-soft);
    box-sizing: border-box;
  }
  .gantt-ruler-days {
    position: relative;
    height: 28px;
  }
  .gantt-ruler-day {
    position: absolute;
    top: 0;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-muted);
    box-sizing: border-box;
  }
  .gantt-ruler-day.weekend { background: rgba(0, 0, 0, 0.03); }
  .gantt-ruler-day.today {
    background: rgba(200, 68, 42, 0.12);
    color: #c8442a;
    font-weight: 700;
  }

  .gantt-bars { position: relative; }
  .gantt-bar-row {
    position: relative;
    height: 48px;
    margin: 8px 0 0;
  }
  .gantt-bar-row:first-child { margin-top: 8px; }
  .gantt-bar {
    position: absolute;
    top: 6px;
    height: 36px;
    border-radius: 6px;
    cursor: pointer;
    overflow: visible;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .gantt-bar:hover {
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
  }
  .gantt-bar.status-not-started { background: #d4cfc4; }
  .gantt-bar.status-in-progress { background: #e8a87c; }
  .gantt-bar.status-completed   { background: #9bc995; }
  .gantt-bar.status-paused      { background: #d49b8e; }
  .gantt-bar-fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    border-radius: 6px 0 0 6px;
  }
  .gantt-bar.status-not-started .gantt-bar-fill { background: #a39d8c; }
  .gantt-bar.status-in-progress .gantt-bar-fill { background: #c8442a; }
  .gantt-bar.status-completed   .gantt-bar-fill { background: #6b8e5a; }
  .gantt-bar.status-paused      .gantt-bar-fill { background: #a04438; }
  .gantt-bar-fill.full { border-radius: 6px; }
  .gantt-bar-label {
    position: relative;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
    padding: 0 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
  }
  .gantt-bar-feedback-badge {
    position: absolute;
    right: -8px;
    top: -6px;
    background: var(--ink);
    color: var(--bg);
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    padding: 2px 5px;
    border-radius: 999px;
    z-index: 2;
  }

  .gantt-today-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    background: #c8442a;
    opacity: 0.85;
    z-index: 1;
    pointer-events: none;
  }
  .gantt-today-line::before {
    content: '今天';
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    background: #c8442a;
    color: #fff;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 3px;
    font-family: var(--mono);
    font-weight: 600;
    white-space: nowrap;
  }

  /* === Gantt: mobile cards === */
  .gantt-mobile-list { display: none; }
  .gantt-mobile-card {
    background: var(--card);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    border: 1px solid var(--line-soft);
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.12s ease;
  }
  .gantt-mobile-card:active { transform: scale(0.99); }
  .gantt-mobile-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }
  .gantt-mobile-title {
    flex: 1;
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    color: var(--ink);
    line-height: 1.3;
    word-break: break-word;
  }
  .gantt-mobile-status {
    flex-shrink: 0;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    letter-spacing: 0.02em;
    margin-top: 2px;
  }
  .gantt-mobile-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-muted);
  }
  .gantt-mobile-meta .dates { letter-spacing: 0.02em; }
  .gantt-mobile-progress {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .gantt-mobile-progress-track {
    flex: 1;
    height: 6px;
    background: var(--bg-soft);
    border-radius: 3px;
    overflow: hidden;
  }
  .gantt-mobile-progress-fill {
    height: 100%;
    transition: width 0.2s ease;
  }
  .gantt-mobile-progress-fill.status-not-started { background: #a39d8c; }
  .gantt-mobile-progress-fill.status-in-progress { background: #c8442a; }
  .gantt-mobile-progress-fill.status-completed   { background: #6b8e5a; }
  .gantt-mobile-progress-fill.status-paused      { background: #a04438; }
  .gantt-mobile-progress-text {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--ink);
    min-width: 36px;
    text-align: right;
  }

  /* === Gantt: status pills (mobile + sidebar) === */

      owner: p.owner ? p.owner.trim() : null,
      start_date: p.startDate,
      end_date: p.endDate,
      progress: typeof p.progress === 'number' ? Math.max(0, Math.min(100, Math.round(p.progress))) : 0,
      status: PROJECT_STATUS_LIST.includes(p.status) ? p.status : DEFAULT_PROJECT_STATUS,
      notes: p.notes ? p.notes : null,
      related_feedback_ids: Array.isArray(p.relatedFeedbackIds) ? p.relatedFeedbackIds : [],
      updated_at: new Date().toISOString()
    };
    if (p.id) row.id = p.id;
    return row;
  }
  function fromProjectRow(row) {
    return {
      id: row.id,
      title: row.title || '',
      owner: row.owner || '',
      startDate: row.start_date || '',
      endDate: row.end_date || '',
      progress: typeof row.progress === 'number' ? row.progress : 0,
      status: PROJECT_STATUS_LIST.includes(row.status) ? row.status : DEFAULT_PROJECT_STATUS,
      notes: row.notes || '',
      relatedFeedbackIds: Array.isArray(row.related_feedback_ids) ? row.related_feedback_ids : [],
      createdAt: row.created_at ? new Date(row.created_at).getTime() : Date.now(),
      updatedAt: row.updated_at ? new Date(row.updated_at).getTime() : Date.now()
    };
  }

  async function cloudListProjects() {
    _assertCloud();
    const { data, error } = await supabase
      .from(PROJECTS_TABLE)
      .select('*')
      .order('start_date', { ascending: true });
    if (error) throw error;
    return (data || []).map(fromProjectRow);
  }
  async function cloudInsertProject(p) {
    _assertCloud();
    const row = toProjectRow(p);
    delete row.id; // let DB generate UUID
    const { data, error } = await supabase
      .from(PROJECTS_TABLE)
      .insert(row)
      .select()
      .single();
    if (error) throw error;
    return fromProjectRow(data);
  }
  async function cloudUpdateProject(id, patch) {
    _assertCloud();
    const row = {};
    if ('title' in patch) row.title = (patch.title || '').trim();
    if ('owner' in patch) row.owner = patch.owner ? patch.owner.trim() : null;
    if ('startDate' in patch) row.start_date = patch.startDate;
    if ('endDate' in patch) row.end_date = patch.endDate;
    if ('progress' in patch) row.progress = Math.max(0, Math.min(100, Math.round(patch.progress)));
    if ('status' in patch) row.status = PROJECT_STATUS_LIST.includes(patch.status) ? patch.status : DEFAULT_PROJECT_STATUS;
    if ('notes' in patch) row.notes = patch.notes ? patch.notes : null;
    if ('relatedFeedbackIds' in patch) row.related_feedback_ids = Array.isArray(patch.relatedFeedbackIds) ? patch.relatedFeedbackIds : [];
    row.updated_at = new Date().toISOString();
    const { data, error } = await supabase
      .from(PROJECTS_TABLE)
      .update(row)
      .eq('id', id)
      .select()
      .single();
    if (error) throw error;
    return fromProjectRow(data);
  }
  async function cloudDeleteProject(id) {
    _assertCloud();

    if (error) throw error;

  // === Date helpers for gantt ===
  function parseDate(s) {
    if (!s || typeof s !== 'string') return null;
    const [y, m, d] = s.split('-').map(Number);
    if (!y || !m || !d) return null;
    return new Date(y, m - 1, d);
  }
  function formatDateISO(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function daysBetween(a, b) {
    // Calendar days from a to b (both at local midnight).
    const ma = new Date(a.getFullYear(), a.getMonth(), a.getDate()).getTime();
    const mb = new Date(b.getFullYear(), b.getMonth(), b.getDate()).getTime();
    return Math.round((mb - ma) / DAY_MS);
  }
  function isValidProject(p) {
    return !!(p && p.title && parseDate(p.startDate) && parseDate(p.endDate));
  }

  // === Storage wrappers ===
  async function storageUpload(feedbackId, fileOrBlob, originalName, mimeHint) {
    _assertCloud();
    const ts = Date.now();
    const safe = sanitizeFilename(originalName);
    const path = `${feedbackId}/${ts}-${Math.random().toString(36).slice(2, 6)}-${safe}`;
    const opts = { contentType: fileOrBlob.type || mimeHint || 'application/octet-stream', upsert: false };
    const { error } = await supabase.storage.from(STORAGE_BUCKET).upload(path, fileOrBlob, opts);
    if (error) throw error;
    const { data } = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(path);
    return { url: data.publicUrl, path };
  }
  async function storageRemove(paths) {
    if (!supabase) return;
    const valid = (paths || []).filter(p => typeof p === 'string' && p);
    if (valid.length === 0) return;
    const { error } = await supabase.storage.from(STORAGE_BUCKET).remove(valid);
    if (error) throw error;
  }

  // === Legacy IndexedDB detection (read-only; used to prompt user to import) ===
  async function legacyIDBCount() {
    if (!('indexedDB' in window)) return 0;
    try {
      if (typeof indexedDB.databases === 'function') {
        const dbs = await indexedDB.databases();
        if (!dbs.some(d => d.name === LEGACY_IDB_NAME)) return 0;
      }
    } catch (_) { /* fall through */ }
    return new Promise((resolve) => {
      let settled = false;
      const finish = (n) => { if (!settled) { settled = true; resolve(n); } };
      let req;
      try {
        req = indexedDB.open(LEGACY_IDB_NAME);
      } catch (e) { return finish(0); }
      req.onerror = () => finish(0);
      req.onsuccess = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(LEGACY_IDB_STORE)) {
          db.close();
          return finish(0);
        }
        try {
          const t = db.transaction(LEGACY_IDB_STORE, 'readonly');
          const r = t.objectStore(LEGACY_IDB_STORE).count();
          r.onsuccess = () => { db.close(); finish(r.result || 0); };
          r.onerror = () => { db.close(); finish(0); };
        } catch (e) {
          db.close(); finish(0);
        }
      };
    });
  }
  async function legacyIDBGetAll() {
    if (!('indexedDB' in window)) return [];
    return new Promise((resolve) => {
      const req = indexedDB.open(LEGACY_IDB_NAME);
      req.onerror = () => resolve([]);
      req.onsuccess = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(LEGACY_IDB_STORE)) {
          db.close(); return resolve([]);
        }
        const t = db.transaction(LEGACY_IDB_STORE, 'readonly');
        const r = t.objectStore(LEGACY_IDB_STORE).getAll();
        r.onsuccess = () => { db.close(); resolve(r.result || []); };
        r.onerror = () => { db.close(); resolve([]); };
      };
    });
  }
  async function clearLegacyIDB() {
    return new Promise((res, rej) => {
      const req = indexedDB.deleteDatabase(LEGACY_IDB_NAME);
      req.onsuccess = () => res();
      req.onerror = () => rej(req.error);
      req.onblocked = () => rej(new Error('数据库被阻塞，请关闭其他打开本页的标签后重试'));
    });
  }

  // === Normalization ===
  function migrateCategory(cat) {
    if (typeof cat !== 'string' || !cat) return DEFAULT_CATEGORY;
    if (cat === '年排名') return '排名'; // legacy rename
    return CATEGORIES.includes(cat) ? cat : DEFAULT_CATEGORY;
  }

  // Accept both old (dataUrl, MIME type) and new (url, path, simplified type) media shapes.
  function normalizeMedia(m) {
    if (!m || typeof m !== 'object') return null;
    const url = typeof m.url === 'string' ? m.url : '';
    const dataUrl = typeof m.dataUrl === 'string' ? m.dataUrl : '';
    if (!url && !dataUrl) return null;
    let type = 'image';
    if (m.type === 'video' || (typeof m.type === 'string' && m.type.startsWith('video/'))) type = 'video';
    else if (m.type === 'image' || (typeof m.type === 'string' && m.type.startsWith('image/'))) type = 'image';
    const out = {
      id: typeof m.id === 'string' && m.id ? m.id : uid(),
      type,
      name: typeof m.name === 'string' ? m.name : '',
      url,
      path: typeof m.path === 'string' ? m.path : ''
    };
    if (!url && dataUrl) out.dataUrl = dataUrl; // preserved for import-time re-upload
    return out;
  }

  // Accepts both internal shape (problem) and import shape (description).
  function normalizeItem(it) {
    if (!it || typeof it !== 'object') it = {};
    const media = Array.isArray(it.media) ? it.media.map(normalizeMedia).filter(Boolean) : [];
    const problem = typeof it.problem === 'string' ? it.problem
                  : typeof it.description === 'string' ? it.description
                  : '';
    return {
      id: typeof it.id === 'string' && it.id ? it.id : uid(),
      title: typeof it.title === 'string' ? it.title : '',
      category: migrateCategory(it.category),
      status: STATUS_LIST.includes(it.status) ? it.status : DEFAULT_STATUS,
      media,
      problem,
      solution: typeof it.solution === 'string' ? it.solution : '',
      createdAt: typeof it.createdAt === 'number'
        ? it.createdAt
        : (typeof it.created_at === 'string' ? new Date(it.created_at).getTime() : Date.now())
    };
  }

  function getStatusOf(item) {
    return STATUS_LIST.includes(item?.status) ? item.status : DEFAULT_STATUS;
  }

  function formatRelativeTime(ts) {
    const now = Date.now();
    const diff = now - ts;
    const MIN = 60_000;
    const HOUR = 60 * MIN;
    const DAY = 24 * HOUR;
    if (diff < MIN) return '刚刚';
    if (diff < HOUR) return Math.floor(diff / MIN) + ' 分钟前';
    const dnow = new Date(now);
    const dt = new Date(ts);
    if (dnow.toDateString() === dt.toDateString()) {
      return Math.floor(diff / HOUR) + ' 小时前';
    }
    const y = new Date(now); y.setDate(y.getDate() - 1);
    if (y.toDateString() === dt.toDateString()) {
      const hh = String(dt.getHours()).padStart(2, '0');
      const mm = String(dt.getMinutes()).padStart(2, '0');
      return `昨天 ${hh}:${mm}`;
    }
    if (diff < 7 * DAY) return Math.floor(diff / DAY) + ' 天前';
    const m = String(dt.getMonth() + 1).padStart(2, '0');
    const d = String(dt.getDate()).padStart(2, '0');
    return `${m}-${d}`;
  }

  function renderTileReadonly(m) {

      .replaceAll('&', '&amp;')

  // === Card events (read-only: edit + delete + preview) ===

  // === Gantt (解决进度) rendering ===
  const ganttChartEl = document.getElementById('gantt-chart');
  const ganttMobileEl = document.getElementById('gantt-mobile-list');
  const ganttEmptyEl = document.getElementById('gantt-empty');
  const ganttSidebarRowsEl = document.getElementById('gantt-sidebar-rows');
  const ganttRulerEl = document.getElementById('gantt-ruler');
  const ganttBarsEl = document.getElementById('gantt-bars');
  const ganttTimelineInnerEl = document.getElementById('gantt-timeline-inner');

  function renderGantt() {
    const validProjects = projects.filter(isValidProject);
    if (validProjects.length === 0) {
      ganttChartEl.hidden = true;
      ganttMobileEl.hidden = true;
      ganttEmptyEl.hidden = false;
      return;
    }
    ganttEmptyEl.hidden = true;
    const isDesktop = window.innerWidth >= 768;
    if (isDesktop) {
      ganttChartEl.hidden = false;
      ganttMobileEl.hidden = true;
      renderGanttDesktop(validProjects);
    } else {
      ganttChartEl.hidden = true;
      ganttMobileEl.hidden = false;
      renderGanttMobile(validProjects);
    }
  }

  function computeGanttRange(items) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const half = GANTT_HALF_RANGE[ganttView] || 15;
    let start = new Date(today.getTime() - half * DAY_MS);
    let end = new Date(today.getTime() + half * DAY_MS);
    items.forEach(p => {
      const s = parseDate(p.startDate);
      const e = parseDate(p.endDate);
      if (s && s < start) start = new Date(s);
      if (e && e > end) end = new Date(e);
    });
    // Pad a few days on each side for visual breathing room.
    start.setDate(start.getDate() - 2);
    end.setDate(end.getDate() + 2);
    return { start, end, today };
  }

  function renderGanttDesktop(items) {
    const dayWidth = GANTT_DAY_WIDTH[ganttView] || 24;
    const { start, end, today } = computeGanttRange(items);
    const totalDays = daysBetween(start, end) + 1;
    const totalWidth = totalDays * dayWidth;
    ganttTimelineInnerEl.style.width = totalWidth + 'px';

    // Ruler
    let monthsHtml = '';
    let curMonth = -1, curYear = -1, segStart = 0;
    const flushMonth = (endIdx) => {
      const d = new Date(start);
      d.setDate(start.getDate() + segStart);
      const left = segStart * dayWidth;
      const width = (endIdx - segStart) * dayWidth;
      monthsHtml += `<div class="gantt-ruler-month" style="left:${left}px; width:${width}px">${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}</div>`;
    };
    for (let i = 0; i < totalDays; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      const m = d.getMonth();
      const y = d.getFullYear();
      if (m !== curMonth || y !== curYear) {
        if (curMonth !== -1) flushMonth(i);
        curMonth = m;
        curYear = y;
        segStart = i;
      }
    }
    flushMonth(totalDays);

    let daysHtml = '';
    for (let i = 0; i < totalDays; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      const isWeekend = d.getDay() === 0 || d.getDay() === 6;
      const isToday = d.toDateString() === today.toDateString();
      const cls = ['gantt-ruler-day'];
      if (isWeekend) cls.push('weekend');
      if (isToday) cls.push('today');
      const label = dayWidth >= 24 ? d.getDate() : (dayWidth >= 16 ? d.getDate() : (isToday || d.getDate() === 1 ? d.getDate() : ''));
      daysHtml += `<div class="${cls.join(' ')}" style="left:${i * dayWidth}px; width:${dayWidth}px">${label}</div>`;
    }
    ganttRulerEl.innerHTML = `<div class="gantt-ruler-months">${monthsHtml}</div><div class="gantt-ruler-days">${daysHtml}</div>`;

    // Bars (one row per project)
    const todayOffset = daysBetween(start, today) * dayWidth + dayWidth / 2;
    let barsHtml = '';
    items.forEach(p => {
      barsHtml += `<div class="gantt-bar-row" data-project-id="${escapeAttr(p.id)}">${renderGanttBar(p, start, dayWidth)}</div>`;
    });
    // Today line spans the whole bars area.
    const totalHeight = items.length * 56 + 8;
    barsHtml += `<div class="gantt-today-line" style="left:${todayOffset}px; height:${totalHeight}px"></div>`;
    ganttBarsEl.innerHTML = barsHtml;
    ganttBarsEl.style.height = totalHeight + 'px';

    // Sidebar
    ganttSidebarRowsEl.innerHTML = items.map(p => renderGanttSidebarRow(p)).join('');

    // Wire clicks on bars + sidebar rows.
    ganttBarsEl.querySelectorAll('.gantt-bar').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.dataset.projectId;
        const p = projects.find(x => x.id === id);
        if (p) openProjectForm(p);
      });
    });
    ganttSidebarRowsEl.querySelectorAll('.gantt-sidebar-row').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.dataset.projectId;
        const p = projects.find(x => x.id === id);
        if (p) openProjectForm(p);
      });
    });
  }

  function renderGanttBar(p, rangeStart, dayWidth) {
    const s = parseDate(p.startDate);
    const e = parseDate(p.endDate);
    const offsetDays = daysBetween(rangeStart, s);
    const lenDays = daysBetween(s, e) + 1;
    const left = offsetDays * dayWidth;
    const width = Math.max(lenDays * dayWidth, 24);
    const statusCls = 'status-' + (PROJECT_STATUS_CLASS[p.status] || 'not-started');
    const pct = Math.max(0, Math.min(100, p.progress || 0));
    const fillWidth = width * pct / 100;
    const fillCls = pct >= 100 ? 'gantt-bar-fill full' : 'gantt-bar-fill';
    const relCount = Array.isArray(p.relatedFeedbackIds) ? p.relatedFeedbackIds.length : 0;
    const badge = relCount > 0 ? `<span class="gantt-bar-feedback-badge">${relCount}</span>` : '';
    return `
      <div class="gantt-bar ${statusCls}" data-project-id="${escapeAttr(p.id)}" style="left:${left}px; width:${width}px">
        <div class="${fillCls}" style="width:${fillWidth}px"></div>
        <div class="gantt-bar-label">${escapeAttr(p.title)} · ${pct}%</div>
        ${badge}
      </div>

  // Cleanup orphaned uploads when user cancels.
  async function cleanupOrphanedUploads() {
    if (formUploadsThisSession.length === 0) return;
    const paths = formUploadsThisSession.slice();
    formUploadsThisSession = [];
    try {
      await storageRemove(paths);
    } catch (e) {
      console.warn('cleanup orphans failed', e);
    }
  }

  function formIsDirty() {
    if (!formOriginal) return false;
    if (formTitle.value !== formOriginal.title) return true;
    if (formCategory.value !== formOriginal.category) return true;
    if (formStatus.value !== formOriginal.status) return true;
    if (formProblem.value !== formOriginal.problem) return true;
    if (formSolution.value !== formOriginal.solution) return true;
    const curr = draft.media.map(m => m.id);
    if (curr.length !== formOriginal.mediaIds.length) return true;
    for (let i = 0; i < curr.length; i++) {
      if (curr[i] !== formOriginal.mediaIds[i]) return true;
    }
    return false;
  }

  function attemptCloseForm() {
    if (formUploadInflight > 0) {
      toast('正在上传媒体，请稍候');
      return;
    }
    if (formIsDirty()) {
      const msg = editingId ? '放弃本次修改？' : '放弃这条反馈？';
      confirmSheet(msg, '已填写或改动的内容将不会保存。', async () => {
        await cleanupOrphanedUploads();
        closeForm();
      });
    } else {
      // No changes to commit, but there may still be one-tap-uploaded media to clean.
      cleanupOrphanedUploads().finally(closeForm);
    }
  }

  async function submitForm() {
    if (formUploadInflight > 0) {
      toast('正在上传媒体，请稍候');
      return;
    }
    const title = formTitle.value.trim();
    const problem = formProblem.value.trim();
    if (!title) {
      toast('请填写问题标题');
      formTitle.focus();
      return;
    }
    if (!problem) {
      toast('请填写问题描述');
      formProblem.focus();
      return;
    }
    const category = CATEGORIES.includes(formCategory.value) ? formCategory.value : DEFAULT_CATEGORY;
    const status = STATUS_LIST.includes(formStatus.value) ? formStatus.value : DEFAULT_STATUS;
    const wasEditing = !!editingId;
    const id = wasEditing ? editingId : formFeedbackId;
    const existing = wasEditing ? state.find(it => it.id === editingId) : null;
    const item = {
      id,
      title,
      category,
      status,
      media: draft.media.map(m => ({ id: m.id, type: m.type, url: m.url, path: m.path, name: m.name })),
      problem,
      solution: formSolution.value.trim(),
      createdAt: existing ? existing.createdAt : Date.now()
    };

    formSubmitBtn.disabled = true;
    formSubmitBtn.textContent = '保存中…';
    try {
      await cloudUpsert(item);
    } catch (e) {
      formSubmitBtn.disabled = false;
      formSubmitBtn.textContent = wasEditing ? '保存修改' : '提交反馈';
      toast('保存失败：' + (e?.message || e));
      return; // keep modal open with input intact
    }
    formSubmitBtn.disabled = false;
    formSubmitBtn.textContent = wasEditing ? '保存修改' : '提交反馈';

    // Commit pending removals (best-effort).
    if (formRemovesPending.length > 0) {
      const paths = formRemovesPending.slice();
      formRemovesPending = [];
      storageRemove(paths).catch(err => console.warn('storage remove failed', err));
    }
    // Uploads committed: don't clean.
    formUploadsThisSession = [];

    if (wasEditing) {
      const idx = state.findIndex(it => it.id === editingId);
      if (idx >= 0) state[idx] = item;
      else state.unshift(item);
    } else {
      state.unshift(item); // newest first to match cloud order
    }
    render();
    closeForm();
    toast(wasEditing ? '已保存修改' : '已添加');
  }

  // === Image compression (returns Blob for upload) ===
  function loadImage(src) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = () => rej(new Error('图片加载失败'));
      img.src = src;
    });
  }

  function canvasToBlob(canvas, type, quality) {
    return new Promise((res, rej) => {
      canvas.toBlob((blob) => {
        if (blob) res(blob);
        else rej(new Error('canvas.toBlob 失败'));
      }, type, quality);
    });
  }

  async function compressImage(file) {
    // Skip GIF (animation) and SVG (vector) — keep original blob.
    if (file.type === 'image/gif' || file.type === 'image/svg+xml') {
      return { blob: file, type: file.type, name: file.name };
    }
    let objectUrl = null;
    try {
      objectUrl = URL.createObjectURL(file);
      const img = await loadImage(objectUrl);
      if (img.naturalWidth <= IMG_MAX_DIM && img.naturalHeight <= IMG_MAX_DIM) {
        return { blob: file, type: file.type, name: file.name };
      }
      const ratio = Math.min(IMG_MAX_DIM / img.naturalWidth, IMG_MAX_DIM / img.naturalHeight);
      const w = Math.round(img.naturalWidth * ratio);
      const h = Math.round(img.naturalHeight * ratio);
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const blob = await canvasToBlob(canvas, 'image/jpeg', IMG_QUALITY);
      const baseName = (file.name || 'image').replace(/\.[^.]+$/, '');
      return { blob, type: 'image/jpeg', name: baseName + '.jpg' };
    } catch (e) {
      return { blob: file, type: file.type, name: file.name };
    } finally {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
    }
  }

  function setFormUploadingState(delta) {
    formUploadInflight += delta;
    const mediaAdd = formMediaGrid.querySelector('.media-add');
    if (mediaAdd) mediaAdd.classList.toggle('uploading', formUploadInflight > 0);
    formSubmitBtn.disabled = formUploadInflight > 0;
  }

  async function addMediaFile(f) {
    const isImage = f.type.startsWith('image/');
    const isVideo = f.type.startsWith('video/');
    if (!isImage && !isVideo) {
      toast('不支持的文件类型：' + (f.type || '未知'));
      return;
    }
    if (isVideo && f.size > VIDEO_WARN_BYTES) {
      const sizeMB = (f.size / 1024 / 1024).toFixed(1);
      const ok = await confirmPromise(
        `视频 ${sizeMB}MB，继续上传？`,
        '超过 50MB 的视频会显著增大存储与流量占用。'
      );
      if (!ok) return;
    }

    setFormUploadingState(+1);
    try {
      let blob = f, name = f.name, mime = f.type;
      if (isImage) {
        const r = await compressImage(f);
        blob = r.blob; name = r.name; mime = r.type;
      }
      const { url, path } = await storageUpload(formFeedbackId, blob, name, mime);
      draft.media.push({
        id: uid(),
        type: isVideo ? 'video' : 'image',
        url,
        path,
        name
      });
      formUploadsThisSession.push(path);
    } catch (e) {
      toast('上传失败：' + (e?.message || e));
    } finally {
      setFormUploadingState(-1);
    }
  }

  function renderFormMedia() {
    const tiles = draft.media.map(m => {
      const src = mediaSrc(m);
      const inner = mediaIsVideo(m)
        ? `<video src="${src}" muted playsinline preload="metadata"></video><span class="video-badge">VIDEO</span>`
        : `<img src="${src}" alt="${escapeAttr(m.name || '')}" />`;
      return `
        <div class="media-tile" data-action="form-preview" data-media-id="${m.id}">
          ${inner}
          <button class="media-remove" data-action="form-remove" data-media-id="${m.id}" aria-label="删除">×</button>
        </div>
      `;
    }).join('');
    formMediaGrid.innerHTML = tiles + `
      <label class="media-add${formUploadInflight > 0 ? ' uploading' : ''}">
        <input type="file" accept="image/*,video/*" multiple id="form-media-input" />
        +
      </label>
    `;

    formMediaGrid.querySelectorAll('[data-action="form-preview"]').forEach(tile => {
      tile.addEventListener('click', (e) => {
        if (e.target.closest('[data-action="form-remove"]')) return;
        const m = draft.media.find(x => x.id === tile.dataset.mediaId);
        if (m) openPreview(m);
      });
    });
    formMediaGrid.querySelectorAll('[data-action="form-remove"]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const removed = draft.media.find(m => m.id === btn.dataset.mediaId);
        draft.media = draft.media.filter(m => m.id !== btn.dataset.mediaId);
        if (removed && removed.path) {
          // Decide cleanup vs. pending-removal:
          // - If just uploaded this session, immediate cleanup is safe (not yet referenced anywhere)
          // - Otherwise we'll commit removal on submit (still referenced by old DB row)
          const sessionIdx = formUploadsThisSession.indexOf(removed.path);
          if (sessionIdx >= 0) {
            formUploadsThisSession.splice(sessionIdx, 1);
            storageRemove([removed.path]).catch(err => console.warn(err));
          } else {
            formRemovesPending.push(removed.path);
          }
        }
        renderFormMedia();
      });
    });
    const input = document.getElementById('form-media-input');
    input.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []);
      e.target.value = '';
      for (const f of files) {
        await addMediaFile(f);
        renderFormMedia();
      }
    });
  }

  const projectStatusEl = document.getElementById('project-status');

  const projectProgressValueEl = document.getElementById('project-progress-value');
  const projectFeedbackListEl = document.getElementById('project-feedback-list');
  const projectNotesEl = document.getElementById('project-notes');
  const projectDateErrorEl = document.getElementById('project-date-error');

  // Populate status select once.
  projectStatusEl.innerHTML = PROJECT_STATUS_LIST.map(s =>
    `<option value="${escapeAttr(s)}"${s === DEFAULT_PROJECT_STATUS ? ' selected' : ''}>${escapeAttr(s)}</option>`
  ).join('');

  let projectFormOriginal = null;

  function snapshotProjectForm() {
    return {
      title: projectNameEl.value,
      owner: projectOwnerEl.value,
      startDate: projectStartEl.value,
      endDate: projectEndEl.value,
      status: projectStatusEl.value,
      progress: parseInt(projectProgressEl.value, 10) || 0,
      notes: projectNotesEl.value,
      relatedFeedbackIds: getSelectedFeedbackIds().slice().sort().join(',')
    };
  }

  function projectFormIsDirty() {
    if (!projectFormOriginal) return false;
    const curr = snapshotProjectForm();
    return curr.title !== projectFormOriginal.title
      || curr.owner !== projectFormOriginal.owner
      || curr.startDate !== projectFormOriginal.startDate
      || curr.endDate !== projectFormOriginal.endDate
      || curr.status !== projectFormOriginal.status
      || curr.progress !== projectFormOriginal.progress
      || curr.notes !== projectFormOriginal.notes
      || curr.relatedFeedbackIds !== projectFormOriginal.relatedFeedbackIds;
  }

  function getSelectedFeedbackIds() {
    return Array.from(projectFeedbackListEl.querySelectorAll('input[type="checkbox"]:checked'))
      .map(cb => cb.value);
  }

  function renderProjectFeedbackList(selectedIds) {
    const sel = new Set(selectedIds || []);
    if (state.length === 0) {
      projectFeedbackListEl.innerHTML = `<div class="feedback-link-empty">暂无反馈可关联，先去「问题看板」添加</div>`;
      return;
    }
    projectFeedbackListEl.innerHTML = state.map(it => {
      const title = (it.title || '').trim() || '未命名反馈';
      const cat = getCategoryOf(it);
      const colorClass = CATEGORY_COLOR[cat] || 'neutral';
      const checked = sel.has(it.id) ? ' checked' : '';
      return `
        <label class="feedback-link-item">
          <input type="checkbox" value="${escapeAttr(it.id)}"${checked} />
          <span class="feedback-link-item-title">${escapeAttr(title)}</span>
          <span class="cat-tag ${colorClass}">${escapeAttr(cat)}</span>
        </label>
      `;
    }).join('');
  }

  function validateProjectDates() {
    const s = projectStartEl.value;
    const e = projectEndEl.value;
    if (s && e && s > e) {
      projectDateErrorEl.hidden = false;
      projectFormSubmitBtn.disabled = true;
      return false;
    }
    projectDateErrorEl.hidden = true;
    projectFormSubmitBtn.disabled = false;
    return true;
  }

  function openProjectForm(project) {
    if (project) {
      projectEditingId = project.id;
      projectFormTitleEl.textContent = '编辑项目';
      projectFormSubmitBtn.textContent = '保存';
      projectDeleteBtn.hidden = false;
      projectNameEl.value = project.title || '';
      projectOwnerEl.value = project.owner || '';
      projectStartEl.value = project.startDate || '';
      projectEndEl.value = project.endDate || '';
      projectStatusEl.value = PROJECT_STATUS_LIST.includes(project.status) ? project.status : DEFAULT_PROJECT_STATUS;
      projectProgressEl.value = String(project.progress || 0);
      projectProgressValueEl.textContent = (project.progress || 0) + '%';
      projectNotesEl.value = project.notes || '';
      renderProjectFeedbackList(project.relatedFeedbackIds || []);
    } else {
      projectEditingId = null;
      projectFormTitleEl.textContent = '新增项目';
      projectFormSubmitBtn.textContent = '保存';
      projectDeleteBtn.hidden = true;
      // Default dates: today → today + 7
      const today = new Date();
      const future = new Date(today.getTime() + 7 * DAY_MS);
      projectNameEl.value = '';
      projectOwnerEl.value = '';
      projectStartEl.value = formatDateISO(today);
      projectEndEl.value = formatDateISO(future);
      projectStatusEl.value = DEFAULT_PROJECT_STATUS;
      projectProgressEl.value = '0';
      projectProgressValueEl.textContent = '0%';
      projectNotesEl.value = '';
      renderProjectFeedbackList([]);
    }
    validateProjectDates();
    projectFormOriginal = snapshotProjectForm();
    projectFormMask.classList.add('open');
    projectFormModal.classList.add('open');
    projectFormModal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closeProjectForm() {
    projectFormMask.classList.remove('open');
    projectFormModal.classList.remove('open');
    projectFormModal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    projectEditingId = null;
    projectFormOriginal = null;
  }

  function attemptCloseProjectForm() {
    if (projectFormIsDirty()) {
      const msg = projectEditingId ? '放弃本次修改？' : '放弃这个项目？';
      confirmSheet(msg, '已填写或改动的内容将不会保存。', closeProjectForm);
    } else {
      closeProjectForm();
    }
  }

  async function submitProjectForm() {
    if (!validateProjectDates()) {
      toast('结束日期不能早于开始日期');
      return;
    }
    const title = projectNameEl.value.trim();
    if (!title) {
      toast('请填写项目名');
      projectNameEl.focus();
      return;
    }
    const startDate = projectStartEl.value;
    const endDate = projectEndEl.value;
    if (!startDate || !endDate) {
      toast('请填写起止日期');
      return;
    }
    const status = PROJECT_STATUS_LIST.includes(projectStatusEl.value) ? projectStatusEl.value : DEFAULT_PROJECT_STATUS;
    const progress = parseInt(projectProgressEl.value, 10) || 0;
    const owner = projectOwnerEl.value.trim();
    const notes = projectNotesEl.value.trim();
    const relatedFeedbackIds = getSelectedFeedbackIds();
    const payload = { title, owner, startDate, endDate, status, progress, notes, relatedFeedbackIds };

    projectFormSubmitBtn.disabled = true;
    projectFormSubmitBtn.textContent = '保存中…';
    try {
      if (projectEditingId) {
        const updated = await cloudUpdateProject(projectEditingId, payload);
        const idx = projects.findIndex(p => p.id === projectEditingId);
        if (idx >= 0) projects[idx] = updated;
        else projects.push(updated);
      } else {
        const created = await cloudInsertProject(payload);
        projects.push(created);
      }
      // Keep sorted by start_date asc to match initial fetch order.
      projects.sort((a, b) => (a.startDate || '').localeCompare(b.startDate || ''));
      renderGantt();
      closeProjectForm();
      toast(projectEditingId ? '已保存修改' : '已添加项目');
    } catch (e) {
      toast('保存失败：' + (e?.message || e));
    } finally {
      projectFormSubmitBtn.disabled = false;
      projectFormSubmitBtn.textContent = '保存';
    }
  }

  function deleteProjectFromForm() {
    if (!projectEditingId) return;
    const id = projectEditingId;
    confirmSheet('删除这个项目？', '将从云端永久删除，所有人都将看到删除结果。', async () => {
      projectDeleteBtn.disabled = true;
      try {
        await cloudDeleteProject(id);
        projects = projects.filter(p => p.id !== id);
        renderGantt();
        closeProjectForm();
        toast('已删除');
      } catch (e) {
        toast('删除失败：' + (e?.message || e));
      } finally {
        projectDeleteBtn.disabled = false;
      }
    });
  }
